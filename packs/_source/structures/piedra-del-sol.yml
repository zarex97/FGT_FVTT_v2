# Quetzalcoatl, char_orig_sheets/Copia de Quetzalcoatl.md
# Discussed: docs/28-bounded-fields.md -- "fields that are objects"
#
# The SECOND `Structure` actor, after Medusa's Bloodmark, and the first that
# levitates. Ch. 28's decision is why it is a unit at all: modelling it as one
# gives targeting, destruction, visibility and Health for free rather than
# building a bespoke object layer for one Noble Phantasm.
#
# `undamageable`, NOT Bloodmark's 1 Health. Bloodmark got a single point because
# its own sheet says *"only Masters can destroy a Bloodmark, and it is done by
# simply Attacking it"* -- a destruction clause needs something to spend. This
# sheet contains NO destruction clause at all: the stone ends on her word, on
# the upkeep going unpaid, and on nothing else. Giving it Health would invent a
# way to remove it that her sheet does not offer.
schema: 1
id: piedra-del-sol
name: "Piedra Del Sol"
type: structure
# `levitating` is the Attribute the boarding table already reads (a levitating
# Unit rolls 1d8 rather than 1d12); here it is simply true of the object --
# *"the Piedra Del Sol appears where Quetz is... you can move the figurine into
# the air and Lock it in place"*.
attributes: [structure, levitating]
baseHealth: null
undamageable: true
mov: 0
# A Structure takes no action at all (`rules/actions.mjs#ACTING_KINDS`), so
# it states no target count and no Base Attack: `targets: 0` was clamped to 1
# and `StructureData` declares no `baseAttack` (#100).
range: { panels: 0 }
# "The panel occupied by Piedra Del Sol can still be Moved onto (replace the
# Piedra Del Sol on top of any Units which Move onto that panel)."
sharesPanel: true
