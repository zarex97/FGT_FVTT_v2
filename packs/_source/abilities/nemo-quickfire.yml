# Nemo, char_orig_sheets/Copia de Nemo.md
# Discussed: docs/36-case-remaining.md §36.6 ("A dice-counting attack skill
# with five conditional modifiers")
#
# The only `diceCount` formula in the corpus, and the only ability whose
# reaction ladder REDEFINES a rung instead of removing it.
schema: 1
id: nemo-quickfire
name: "Quickfire"
kind: skill
isAttackSkill: true
slug: quickfire
cooldown: "2◈"
timing: { window: ownTurn }
description: |
  Attack Skill. Range=3. Roll 6 six-sided die, this Attack Skill deals 25 STR damage for each die
  that rolls X or higher, where X=5. The value of X is modified as follows.
  Plus 1 if-
  1. The enemy Unit @effect[evade]{Evades} (instead of performing an Evade roll)
  Minus 1 if-
  1. This Attack Skill is used at a Range of 2 or lower.
  2. The enemy Unit is inflicted with @effect[slow]{Slow}, Immobilize or @effect[stun]{Stun}.
  3. The enemy Unit's Agility is equal or lower than Nemo's.
  After performing this Attack Skill, if the enemy Unit does not perform a Counter on Nemo,
  reduce the Cooldown of Quickfire by 1◈ Turns.
  A DU damaged by this Attack Skill only performs an Injury Roll once, regardless of number of
  hits received. Damage of this Attack Skill is not affected by damaging modifying effects on
  Nemo.
  Cooldown: 2◈ Turns.
targeting:
  # "Range=3" -- his printed Range, restated by the Skill.
  anchor: { kind: targetUnit, range: 3 }
  shape: { kind: unit }
  selection: { relations: [enemy], includeSelf: false, chooser: chosen, count: 1 }
# "The enemy Unit Evades (INSTEAD OF performing an Evade roll)."
#
# The defender may still choose Evade. Choosing it does not roll and does not
# avoid the attack -- it costs Nemo one point of threshold and nothing else.
#
# This is NOT `ForbidReaction`, which removes the rung. A defender who cannot
# evade also cannot worsen the threshold, and the sheet PAYS Nemo for the
# choice rather than forbidding it: the rung stays on the ladder and resolves
# to an emitted option instead of to a die.
reactionOverride:
  evade: { kind: noRoll, emits: "target:reaction:evade" }
damage:
  formula:
    kind: diceCount
    dice: "6d6"
    threshold:
      base: 5
      modifiers:
        # Plus 1. The option `reactionOverride` above emits -- the two are one
        # clause in two halves and must name the same string.
        - { delta: +1, predicate: ["target:reaction:evade"] }
        # Minus 1, clause 1. "at a Range of 2 or lower".
        - { delta: -1, predicate: [{ lte: ["@distance", 2] }] }
        # Minus 1, clause 2. Any ONE of the three, not all.
        - delta: -1
          predicate:
            - { anyOf: ["target:effect:slow", "target:effect:immobilize", "target:effect:stun"] }
        # Minus 1, clause 3. "EQUAL or lower" -- the boundary is inclusive, and
        # an off-by-one here silently costs a die on every even match-up.
        - { delta: -1, predicate: [{ lte: ["@target.agility.value", "@self.agility.value"] }] }
    perSuccess: { amount: 25, component: str }
  component: str
  # "not affected by damaging modifying effects ON NEMO" -- attacker-side only.
  # His own Divinity +50 and any Atk Up do not reach this Skill; the defender's
  # Def Up, Dmg Cut and Block all do. Not `isFixedDamage`, which is a defined
  # term meaning both sides.
  bypassModifiers: { attacker: true, defender: false }
  # "A DU damaged by this Attack Skill only performs an Injury Roll once,
  # regardless of number of hits received." Already built: `engine/attack.mjs`
  # holds a rendezvous across sibling Processes for exactly this.
  singleInjuryRoll: true
phases:
  - kind: damage
  # "After performing this Attack Skill, if the enemy Unit does not perform a
  # Counter on Nemo, reduce the Cooldown of Quickfire by 1◈ Turns."
  #
  # AFTER the Combat Process, because the predicate cannot be answered until
  # the reaction ladder has closed -- which is why this is a phase and not a
  # `cooldownWaiver`. `ability: self` is Quickfire's own clock.
  - kind: cooldown
    # AFTER THE PROCESS, not at declaration. A `cooldown` phase is otherwise a
    # caster phase and runs when the Skill is used -- several rungs before
    # anybody has decided whether to counter -- so the refund would be paid
    # every single time.
    when: afterProcess
    predicate: ["not:target:reaction:counter"]
    changes:
      # Quickfire's own clock, named by content id: `selectAbilities` matches
      # `abilityIds` against content ids, which is what every other ability
      # selector in the system names.
      - { abilityIds: [nemo-quickfire], ticks: "1◈", direction: down }
