# Medea, char_orig_sheets/Copia de Medea.md
schema: 1
id: medea-rain-of-light
name: "Rain of Light: Machia Hecatia Graea"
rank: null
category: spell
cooldown: "3◈"
timing: { window: ownTurn }
isSpell: true
description: |
  Damage Spell. Range +1 for the Combat Process. Hits a 3x3 panel area within Range for 3x damage.
targeting:
  # Range 4: the Servant's 3, plus this Spell's own +1 "for the Combat Process".
  # *"Range+1 for the Combat Process"* -- `rangeBonus`, which is the idiom
  # `anchorRange`'s own docstring names for a reach stated relative to the
  # unit's Range, and the exact wording §46.4-F fixed on two of Anastasia's.
  # It was an absolute 4: her Range is 3 and 3+1 agreed with it, so the two
  # coincided and the freeze was invisible (Ch. 46 §46.11).
  anchor: { kind: withinRange, rangeBonus: 1, metric: chebyshev }
  shape: { kind: square, size: 3 }
  selection: { relations: [enemy], chooser: all }
damage:
  multiplier: 3
  component: mag
phases:
  - kind: damage
    target: reuse
