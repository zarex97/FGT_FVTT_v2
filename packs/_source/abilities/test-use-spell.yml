# Test Spell for UseFailure's live presses (#300, plan Task 15, L2-19, L2-20).
schema: 1
id: test-use-spell
name: "Test Use: Spell"
kind: skill
slug: testUseSpell
isSpell: true
# A Spell is attack-shaped unless it says otherwise (nursery.test's guard).
countsAsAttack: false
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all }
timing: { window: ownTurn }
cooldown: "1 turns"
description: "TEST SPELL. Applies @effect[defUp]{Def Up} to itself."
phases:
  - kind: applyEffects
    target: self
    effects:
      - { id: defUp, magnitude: 10, duration: "1◈" }
