# Medea, char_orig_sheets/Copia de Medea.md
schema: 1
id: medea-teachings-of-circe
name: "Teachings of Circe"
rank: A
cooldown: "4◈"
timing: { window: ownTurn }
description: |
  (Active) Used on an allied Unit within Range 3. Remove all debuffs from it, restore its Health
  by 10% of its maximum value, and apply @effect[npCooldownRegen]{NP Cooldown Regen} for 1◈ Turns.
# An ally within range is a CHOICE, so this one does open a targeting session.
targeting:
  anchor: { kind: targetUnit, range: 3 }
  shape: { kind: unit }
  selection: { relations: [ally, self], includeSelf: true, chooser: all, count: 1 }
phases:
  - kind: removeEffect
    target: reuse
    # By polarity, not by name: "all debuffs" must cover debuffs authored after
    # this Skill was written.
    selector: { polarity: debuff }
  - kind: heal
    target: reuse
    percentOfMax: 10
  - kind: applyEffects
    target: reuse
    effects:
      - { id: npCooldownRegen, duration: "1◈" }
