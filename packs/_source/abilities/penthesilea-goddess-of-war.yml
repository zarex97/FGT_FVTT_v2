# Penthesilea, char_orig_sheets/Copia de Penthesilea.md
schema: 1
id: penthesilea-goddess-of-war
name: "Goddess of War: War God's Military Sash"
isNP: true
# A PASSIVE Noble Phantasm: four standing clauses and nothing to use. Without
# this every NP classified as an attack, so clicking it opened a targeting
# session and offered to spend her Attack on an ability with no active form.
isPassive: true
rank: A
npTags: [antiUnit]
description: |
  (Passive) Active only while @ability[class-mad-enhancement]{Mad Enhancement} is DEACTIVATED. Grants Penthesilea-
  1. Normal Attack damage dealt +(1d4 x 10)%.
  2. Damage received −(1d4 x 10)%; if NP, the magnitude is halved.
  3. Evade rolls reduced by 1d4.
  4. @ability[divinity]{Divinity} Rank raised from B to A.
passiveRules:
  # Every clause carries the same gate: "only active when Mad Enhancement is
  # deactivated". `skillActive` is what distinguishes having Mad Enhancement
  # from having it switched on -- and Penthesilea always has it.
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    roll: { key: goddessOfWarAtk, formula: "1d4", multiplier: 10 }
    predicate: ["not:self:skillActive:madEnhancement", "attack:kind:normal"]
  - key: DamageModifier
    modifierKey: defUp
    direction: taken
    # "if NP, the magnitude of the effect is halved" -- so the same die, scored
    # at half rate against a Noble Phantasm.
    roll: { key: goddessOfWarDef, formula: "1d4", multiplier: 10, npMultiplier: 5 }
    predicate: ["not:self:skillActive:madEnhancement"]
  - key: CheckModifier
    check: evade
    roll: { key: goddessOfWarEvade, formula: "1d4", multiplier: -1 }
    predicate: ["not:self:skillActive:madEnhancement"]
  # Clause 4: "Penthesilea's Divinity Rank is increased from B to A."
  #
  # A shift aimed at another ABILITY's rank rather than at a parameter, which
  # is a different operation and the reason this clause had nowhere to live
  # until now. `to:` names the destination, because B to A is five positions on
  # the dense +/- ladder and making an author count them is how the clause gets
  # written wrong.
  #
  # It carries the same gate as the other three, so her Divinity drops back to
  # B while she is raging -- which is the trade Mad Enhancement is.
  - key: RankShift
    ability: divinity
    to: A
    predicate: ["not:self:skillActive:madEnhancement"]
