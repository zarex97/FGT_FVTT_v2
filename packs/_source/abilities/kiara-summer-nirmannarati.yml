# Sessyoin Kiara (Summer), char_orig_sheets/by-class/Mooncancer/Sessyoin Kiara (Summer).md
#
# "Hits a 5x5 panel area in any non-diagonal direction next to Sessyoin. Deals 4x
#  damage; if the DU has any Mental Debuffs, damage dealt is increased by 100% plus
#  20% for every Mental Debuff (max.10 times) on the DU. Then, has an X% chance of
#  inflicting Instakill on the DU, where X=(20*number of Mental Debuffs on the DU)."
#
# Every Unit in the 5x5 is hit, allies too (#372 reading 17, Gray's 15). The
# Mental Debuffs are counted per instance (`count: {of: effects}`), Bewitchment's
# three counting three: a factor of x(2 + 0.2n), n at most 10, Rama's "+200% is x3"
# shape (reading 18); none at all with no Mental Debuff. The Instakill counts n
# again after the damage, with no ceiling, and rolls nothing at 0 (reading 19).
schema: 1
id: kiara-summer-nirmannarati
name: "Nirmānnarati - Heaven's Form: Paradise of Pleasure - Mandala"
rank: A
isNP: true
categorizedAsNP: true
npTags: [antiWorld]
kind: noblePhantasm
cooldown: "7◈"
timing: { window: ownTurn }
description: |
  Base Attack (MAG) is used. Hits a 5x5 panel area in any non-diagonal direction next to Sessyoin. Deals 4x damage;
  if the DU has any Mental Debuffs, damage dealt is increased by 100% plus 20% for every Mental Debuff (max.10 times)
  on the DU. Then, has an X% chance of inflicting @effect[instakill]{Instakill} on the DU, where X=(20*number of
  Mental Debuffs on the DU). Cooldown: 7◈ Turns.
targeting:
  anchor: { kind: selfEdgeAdjacent }
  shape: { kind: orientedRect, short: 5, long: 5 }
  selection: { relations: [enemy, ally, neutral], chooser: all, includeSelf: false }
  isDamagingAoE: true
damage:
  multiplier: 4
  component: mag
  conditionalMultipliers:
    - factor:
        base: 2
        per: 0.2
        max: 4
        zeroPaysNothing: true
        count: { of: effects, side: target, polarity: debuff, volatility: mental }
      source: "Mental Debuffs"
phases:
  - kind: damage
  - kind: applyEffects
    target: reuse
    effects:
      - id: instakill
        chance: 0
        chanceBonus: { count: { of: effects, side: target, polarity: debuff, volatility: mental }, per: 20, countedOnly: true }
