# char_orig_sheets/extra docs/Character Sheet - Blue Faction (Normal).md
# > "(Saber) Noble Phantasm — Hits a 3x3 panel area in any non-diagonal
# > direction next to Saber for 3x damage. Can only be used once."
#
# The 5d10 in the sheet's formula block is the Attack+/Attack- pool, applied by
# the damage pipeline at stage 2 -- before the multiplier, which is the
# placement the author's own reference calculation requires. NOT authored here.
#
# `selfEdgeAdjacent` is what "in any non-diagonal direction next to" resolves
# to: it sets `anchor.direction`, and `shapes.mjs` then projects the block
# outward from the caster rather than centring it.
schema: 1
id: normal-saber-np
name: "Noble Phantasm"
isNP: true
kind: noblePhantasm
slug: normalSaberNP
maxUses: 1
description: |
  (Active) Hits a 3x3 panel area in any non-diagonal direction next to Saber for 3x damage.
  Can only be used once.
targeting:
  anchor: { kind: selfEdgeAdjacent }
  shape: { kind: square, size: 3 }
  selection: { relations: [enemy, ally, neutral], chooser: all, includeSelf: false }
  limits: { requiresZon: true }
  isDamagingAoE: true
damage: { component: str, multiplier: 3 }
phases:
  - kind: damage
