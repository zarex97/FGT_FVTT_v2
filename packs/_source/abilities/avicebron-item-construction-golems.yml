# Avicebron, char_orig_sheets/by-class/Caster/Avicebron.md (#394).
#
# > *"(Active) When this Skill is used, Avicebron summons a number of Golems. The
# > number summoned is dependant on the situation- 1. If Avicebron is within his
# > Home Base, roll a ten-sided die. [...] 2. If Avicebron is not within his Home
# > Base, roll a six-sided die. [...] There can only be a maximum of 30 Golems on
# > the field. Cooldown: 3◈-⅓◈ Turns."*
#
# Medea's Dragon Tooth Warriors' `summon` phase, one die or the other by where he
# stands. His own Turn and not his Attack (ruling 5); on free panels he picks
# within his Range at the use (rulings 4, 26); a roll past 30 summons up to 30
# and the card says how many the cap took (ruling 6). Construction Source 2, *"1
# for every 3 Golems created"*, rides the same use, counting those created.
#
# Refused while GKM stands (*"Avicebron is unable to create Golems while GKM is
# Active"*): `platformInactive`, Karl's Auctoritas's gate (#351).
schema: 1
id: avicebron-item-construction-golems
name: "Item Construction: Golems"
rank: null
cooldown: "3◈-⅓◈"
timing: { window: ownTurn }
countsAsAttack: false
description: |
  (Active) Avicebron summons a number of Golems. If Avicebron is within his Home Base, roll a
  ten-sided die; if not, roll a six-sided die. The number rolled is the number of Golems summoned.
  When counting the number of Units who Move/Attack during your Turn, one Golem counts as 0.2 of a
  Servant (i.e. 5 Golems are equal to 1 Servant). The same Golem can only Move/Attack once per
  Turn. There can only be a maximum of 30 Golems on the field. An allied Unit cannot be targeted
  for an Attack if there is a Golem within a 2 panel area of the Unit.
  Cooldown: 3◈-⅓◈ Turns.
requirements:
  - { kind: platformInactive, contentId: golem-keter-malkuth, name: "Golem Keter Malkuth" }
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all }
phases:
  - kind: summon
    target: self
    predicate: ["self:inHomeBase"]
    spec:
      countRoll: "1d10"
      types: { 1: golem }
      placement: { withinRange: true, anchor: self, chooser: owner }
      maxOnField: 30
      grantsResource: { resource: construction, per: 3 }
  - kind: summon
    target: self
    predicate: [{ not: "self:inHomeBase" }]
    spec:
      countRoll: "1d6"
      types: { 1: golem }
      placement: { withinRange: true, anchor: self, chooser: owner }
      maxOnField: 30
      grantsResource: { resource: construction, per: 3 }
