# EMIYA, char_orig_sheets/Copia de EMIYA.md
schema: 1
id: emiya-reinforcement
name: "Thaumaturgy: Reinforcement"
rank: null
kind: skill
slug: reinforcement
category: thaumaturgy
isSpell: true
cooldown: "1◈"
# "Used at the start of a Combat Phase" -- ANY Combat Phase he is in, attacking or
# attacked, and not any time in his Turn (ruled 2026-10-14, #208 reading 8). It
# was `[ownTurn, combatPhaseStart]`: `ownTurn` made it a sheet button, pressable
# in the middle of his Turn with no Combat Phase in sight, and the Phase he was
# ATTACKED in never offered it. The pair Karna's Uncrowned Arms Mastership uses:
# his own attack's Phase and the one he defends in. With no `ownTurn` it has no
# button at all; the engine offers it at the window (`windowOnly`, Ch. 17).
timing: { window: [combatPhaseStart, defendingPhaseStart] }
# A Spell, but not an attack: it buffs and resolves. Left to `countsAsAttack`
# and it would spend his Attack for the Turn, because `isSpell` is one of the
# three things that make an ability one.
countsAsAttack: false
negatedBy: [silence]
requirements:
  - { kind: notHasEffect, effectId: silence }
description: |
  Spell. Used at the start of a Combat Phase. During this Combat Phase, Normal Attack damage
  dealt is increased by 30%. Cooldown: 1◈ Turns.
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all }
phases:
  - kind: applyEffects
    target: self
    effects:
      # N.Atk Up, not Atk Up. "Normal Attack damage" is explicit, and a blanket
      # Atk Up would quietly buff his Noble Phantasms too -- which is the whole
      # reason the two effects are separate in Appendix A.
      #
      # "During this Combat Phase": until the Phase's end event, as Mannanán's
      # Tradition Carrier is (ruled 2026-10-14, #208 reading 9). It was ⅓◈, the
      # shortest span the tick grammar has, which outlived the Phase by the rest
      # of the Turn and buffed Normal Attacks the sheet never named. EMIYA hears
      # `combatPhaseEnd` as the attacker and as a defender alike.
      - { id: nAtkUp, magnitude: 30, duration: "until combatPhaseEnd" }
