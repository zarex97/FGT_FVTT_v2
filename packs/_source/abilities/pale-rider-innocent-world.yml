# Pale Rider -- Innocent World, Rank EX.
# Conversion source: char_orig_sheets/Copia de Pale Rider.md
# Data sheet: docs/D-servant-data-sheets.md §D.26
#
# Its six clauses are INTERIOR RULES of Doomsday Come
# (`pale-rider-doomsday-come.yml`), not rules of this Skill. They are facts
# about standing inside that area and nothing else -- "constantly affects all
# enemy Units within 'Doomsday Come'" -- so they belong to the area, which is
# what makes them apply to a Unit dragged in by somebody else and stop applying
# the moment it leaves.
#
# This file is the sheet entry the actor shows, and carries no rules of its
# own. That is deliberate: a Skill whose text describes another ability's area
# is exactly the shape Ch. 43 argues should be authored on the area.
schema: 1
id: pale-rider-innocent-world
name: "Innocent World"
rank: EX
kind: skill
slug: innocentWorld
passive: true
description: |
  (Passive) Constantly affects all enemy Units within 'Doomsday Come'. Applies the following
  effects depending on which of the Unit's Parameters are highest, as follows-
  1. STR highest: All damage dealt is reduced by 50%; if NP, 25%.
  2. END highest: All damage received is increased by 50%; if NP, 25%.
  3. AGI highest: The value of Evade rolls are increased by 4.
  4. MAG highest: Chance of being inflicted by debuffs is increased by 50% and Total Debuff
     Damage taken is increased by 50%.
  5. LUC highest: The value of Luck Check rolls are increased by 4.
  6. If the Unit has any NP whose Rank is higher than all its Parameters: The Servant is
     affected with NP Seal.
  If a Unit has no Parameters, roll a six-sided die and apply the effect corresponding to the
  number rolled; that Unit will receive the same effect every time it is affected by Innocent
  World. If the Unit has two or more Parameters of the same Rank, it is affected by all related
  effects.
  The effects of Innocent World cannot be prevented or removed as long as a Unit is within
  'Doomsday Come'.
passiveRules: []
notes: |
  "Cannot be prevented or removed as long as a Unit is within Doomsday Come" needs no
  machinery: an interior contribution is a standing annotation rather than an applied effect,
  so it is present exactly while the Unit stands inside and gone the moment it leaves. There is
  nothing for Dispel or a Cure to find, and no exit event to clean up.

  The d6 for a Unit with no Parameters is a HASH of the Unit's id folded to 1-6
  (`rules/options.mjs#stableDie`), not a roll that is remembered. It satisfies the clause's
  intent -- the same effect every time, surviving a reload, agreed on by every client without
  anybody storing it -- rather than its letter: no die is ever rolled, so a GM cannot reroll
  one. Recorded in the spec's §9.
