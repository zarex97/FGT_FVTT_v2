description: |
  When Rama is summoned, Flip a Coin. If Heads, roll 2 six-sided die; if Tails, roll 1 six-sided die. The number(s)
  rolled on the di(c)e determines which of the following additional Noble Phantasms Rama possesses during the game:
  1 @np[rama-sudarshana]{Sudarshana}, 2 @np[rama-shuuravara]{Shuuravara},
  3 @np[rama-modhaki-and-shikhari]{Modhaki and Shikhari}, 4 @np[rama-trishula]{Trishula},
  5 @np[rama-pinaka]{Pinaka}.
  Note: If a 6 is rolled, the player can choose any of the available Noble Phantasms (that hasn't been chosen yet).
  A double other than 6 rolls its second die again.
