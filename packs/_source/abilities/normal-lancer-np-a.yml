# char_orig_sheets/extra docs/Character Sheet - Blue Faction (Normal).md
# > "(Lancer) Noble Phantasm (a) — Hits a 1x4 or 4x1 panel area in any direction
# > next to Lancer for 3x damage; if diagonal, 1x3 or 3x1 panel area. Can only
# > be used once."
#
# `diagonalLength` is a field `shapes.mjs` already reads, so the shortened
# diagonal needs no new machinery.
schema: 1
id: normal-lancer-np-a
name: "Noble Phantasm (a)"
isNP: true
kind: noblePhantasm
slug: normalLancerNPA
maxUses: 1
description: |
  (Active) Hits a 1x4 or 4x1 panel area in any direction next to Lancer for 3x damage;
  if diagonal, 1x3 or 3x1 panel area. Can only be used once.
targeting:
  anchor: { kind: selfEdgeAdjacent }
  shape: { kind: line, length: 4, diagonalLength: 3 }
  selection: { relations: [enemy, ally, neutral], chooser: all, includeSelf: false }
  limits: { requiresZon: true }
  isDamagingAoE: true
damage: { component: str, multiplier: 3 }
phases:
  - kind: damage
