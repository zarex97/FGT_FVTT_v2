# Medea, char_orig_sheets/Copia de Medea.md
#
# Both clauses are ROLLED, which is why they carry `roll:` rather than flat
# numbers: 5d20 is 5-100, and averaging it would make a Caster in her own Home
# Base predictable in a way the sheet does not intend.
schema: 1
id: medea-territory-creation
name: "Territory Creation"
rank: A
kind: classSkill
passive: true
copyable: { allowed: false, reason: classSkill }
description: |
  (Passive 1) In its Home Base, all damage dealt by this Unit is increased by 5d20, including NP.
  (Passive 2) While this Unit is on the field, damage taken by allied Units in their own Home
  Base is further reduced by (3d10+20), including NP.
passiveRules:
  # Clause 1 is about MEDEA, so an ordinary predicate on her own options works.
  # "including NP" is why there is no `attack:kind` predicate: the default would
  # have been to exempt Noble Phantasms.
  - key: DamageModifier
    stage: flat
    predicate: ["self:inHomeBase"]
    roll: { key: territoryCreationBonus, formula: "5d20" }

  # Clause 2 is about EVERYONE ELSE, so it is an aura -- and one with no radius,
  # because "while this Unit is on the field" is not a distance. Its condition
  # is on the RECIPIENT ("allied Units who are in THEIR Home Base"), which a
  # predicate cannot say: contributions are evaluated against the source.
  - key: Aura
    scope: field
    relations: [ally, self]
    stacking: highestOnly
    group: territoryCreation
    requiresRecipient: { inHomeBase: true }
    elements:
      - key: DamageNegation
        roll: { key: territoryCreationWard, formula: "3d10+20" }
