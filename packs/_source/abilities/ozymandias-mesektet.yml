# Ozymandias, char_orig_sheets/Copia de Ozymandias.md
#
# > "(Passive) The source of Ozymandias' Normal Attacks. All Normal Attacks use
# > Base Attack (MAG) and deal extra damage to Units with the 'Dark' Attribute,
# > damage dealt is increased by 100%. Light damage."
# > "(Active) Hits a 3x3 panel area within Range for 4x damage plus 100; deals
# > extra damage to Units with the 'Dark' Attribute, damage dealt is increased
# > by 100% (doubled). Light damage. Cooldown: 7◈+⅓◈ Turns."
#
# The passive's COMPONENT and ELEMENT live on the Servant's `normalAttack` --
# they are properties of the swing, and `normalAttackAt` is what the pipeline
# asks. What lives here is the Dark bonus, predicated on the target and on the
# attack being a Normal one.
#
# The ACTIVE's doubling is folded into the MULTIPLIER via `damage.branches`,
# which is Jack's Maria the Ripper's argument: "damage dealt is doubled"
# multiplies the whole of this NP's own output, where a stage-5 modifier would
# instead be one more additive percentage among everyone else's.
schema: 1
id: ozymandias-mesektet
name: "Mesektet: The Solar Ship of the Dark Night"
isNP: true
rank: "A+"
npTags: [antiArmy]
kind: noblePhantasm
slug: mesektet
element: light
cooldown: { max: "7◈+⅓◈" }
description: |
  (Passive) The source of Ozymandias' Normal Attacks. All Normal Attacks use Base Attack (MAG) and
  deal extra damage to Units with the 'Dark' Attribute — damage dealt is increased by 100%.
  Light damage.
  (Active) Hits a 3x3 panel area within Range for 4x damage plus 100; deals extra damage to Units
  with the 'Dark' Attribute, damage dealt is increased by 100% (doubled). Light damage.
# The passive's "+100% against Dark" lives on his Normal Attack itself
# (`servants/ozymandias.yml`, `normalAttack.conditionalMultipliers`): a ×2 of its
# own at stage 3, not an Atk Up summed with his others (ruled 2026-10-06, #189
# readings 3 and 18). It was a `DamageModifier` atkUp +100 here.
targeting:
  anchor: { kind: withinRange, range: 3, metric: chebyshev }
  shape: { kind: square, size: 3 }
  selection: { relations: [enemy, ally, neutral], chooser: all, includeSelf: false }
  limits: { requiresZon: true }
  isDamagingAoE: true
damage:
  component: mag
  multiplier: 4
  flatBonus: 100
  element: light
  # "...deals extra damage to Units with the 'Dark' Attribute, damage dealt is
  # increased by 100% (doubled)." Inside the bracket, before the +100, as the
  # author's own reference calculation puts an NP's doubling --
  # [(200+35) × 4 × 2 + 100] -- and as Karna's and Nemo's are (ruled
  # 2026-10-06, #189 reading 18, superseding reading 2). It was `multiplier: 8`.
  conditionalMultipliers:
    - { factor: 2, predicate: ["target:attribute:dark"], source: "Dark (+100%)" }
phases:
  - kind: damage
  - kind: cooldown
