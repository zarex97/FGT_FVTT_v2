description: |
  Base Attack (MAG) is used. Hits a 9x9 panel area in any non-diagonal direction next to herself. First, has the
  following effects-
  1. Inflicts @effect[agilityLoss]{Agility Loss} for 1◈ Turns, if this debuff fails to be inflicted, the DU loses
     2 Agility.
  2. Inflicts @effect[luckLoss]{Luck Loss} for 1◈ Turns, if this debuff fails to be inflicted, the DU loses 2 Luck.
  3. Inflicts @effect[defDwnB]{Def Dwn (B)} for 1◈ Turns, all damage taken is increased by 20%; if NP, 30%.
  Deals 5x damage, damage dealt is further increased by 200% against Units with the [Man], [Star], or 'Living
  Human' Attributes. Then, has the following effects on all allied Units within a 3 panel area of herself-
  1. Applies @effect[atkUp]{Atk Up} for 1◈ Turns, all damage dealt is increased by 20%; if NP, 10%.
  2. NP Cooldown is reduced by ½◈ Turns.
  3. NP Cooldown of affected Units with the [Man], [Star], or 'Living Human' Attributes is reduced by ½◈ Turns.
  Cooldown: 8◈ Turns
