# char_orig_sheets/extra docs/Character Sheet - Blue Faction (Normal).md
#
# > "(Master) Magic Crest — Damage Spell. Deals 2x damage. *Categorized as Noble
# > Phantasm.* Cooldown: 2◈ Turns"
#
# `categorizedAsNP` rather than `isNP`: it COUNTS as a Noble Phantasm for every
# rule that asks -- Magic Resistance's doubled dice, the "including NP"
# reductions, `CS: Force Noble Phantasm` -- without being one for the purposes
# of a Servant's NP uses, which a Master does not have.
schema: 1
id: normal-magic-crest
name: "Magic Crest"
source: class
slug: magicCrest
kind: skill
categorizedAsNP: true
# "Magic Crest -- usable after 2 full Rounds, from Round 3" (Ch. 07 §7.9's own
# table row). It is `categorizedAsNP`, so the global Noble Phantasm gate covers
# it -- and this line is what keeps it usable three Rounds before that.
#
# A stated gate OVERRIDES the global one. Under the `max()` rule this replaced,
# `max(6, 3)` is 6 and this line would be dead: a Normal-ruleset Master would
# have had no offensive option at all before Round 6.
npGateRound: 3
cooldown: { max: "2◈" }
description: |
  (Active) Damage Spell. Deals 2x damage. Categorized as Noble Phantasm.
  Cooldown: 2◈ Turns. Usable from Round 3 onward.
targeting:
  anchor: { kind: withinRange, range: 2, metric: chebyshev }
  shape: { kind: unit }
  selection: { relations: [enemy], chooser: chosen, includeSelf: false }
damage:
  component: mag
  multiplier: 2
phases:
  - kind: damage
  - kind: cooldown
