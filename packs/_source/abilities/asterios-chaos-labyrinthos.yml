# Asterios, char_orig_sheets/Copia de Asterios.md
# The bounded field model is Ch. 43; this is a point in its six axes.
schema: 1
id: asterios-chaos-labyrinthos
name: "Chaos Labyrinthos: Eternally Unchanging Labyrinth"
isNP: true
rank: EX
npTags: [labyrinth, boundedField]
# "Cooldown: 8◈ Turns AFTER THE NP ENDS." `countFrom: deactivation` is the
# difference between a Labyrinth that may be recast eight Turns after it opened
# -- while it is still standing, and with four Turns of paid extensions still
# available -- and one that may be recast eight Turns after it closed. Authored
# as a bare `"8◈"`, `cooldownFor` started the clock at the cast and the sheet's
# whole attrition cycle collapsed. `engine/fields.mjs` starts it at the end
# instead (the same mechanism Presence Concealment and Sikera Usum use).
cooldown: { max: "8◈", countFrom: deactivation }
description: |
  (Non-damaging) Creates a 9x9 Labyrinth around Asterios; 11x11 if the Region is Greece.
  Asterios gains MOV +4 inside. Enemies inside suffer @effect[atkDwn]{Atk Dwn} and @effect[defDwn]{Def Dwn} on activation, have
  their MOV reduced by 2 (minimum 2), and must roll to escape. Units outside and inside cannot
  reach each other at all. Lasts for 4◈ Turns, extendable by 2◈ more for 200 of Asterios'
  Health, repeatably. Ends at the end of the Turn if Asterios is defeated.
targeting:
  # `self`, not `selfCentred` -- which is not an anchor this system has and never
  # was. `resolveAnchor`'s default branch THROWS on an unknown kind, so this
  # Noble Phantasm could not be used at all: it did not silently do less than its
  # text, it raised a RangeError the moment anybody pressed it. The content
  # validator now checks anchors and shapes against the resolver's own
  # vocabulary, which is how this was found.
  anchor: { kind: self }
  shape: { kind: square, size: 9 }
  # Clause 2 is *"inflicts Atk Dwn ... on all ENEMY Units within the Labyrinth"*,
  # and the phases below are what it resolves against. `[enemy, ally, self]`
  # handed Asterios's own allies -- and Asterios -- 40% Atk Dwn and 40% Def Dwn
  # for 2◈ Turns every time he opened his own Noble Phantasm.
  #
  # The FIELD is what catches everybody: `membership` below lets any Unit enter
  # and traps them, which is a different question from who the activation
  # debuffs. The `createField` phase names `target: self` so it still runs from
  # the caster despite him not being in this list.
  selection: { relations: [enemy], chooser: all, includeSelf: false }
  limits: { requiresZon: true }
# "(Non-damaging)" is the first word of the sheet's description, and it needs no
# `damage:` block to say so: an ability with phases and no `damage` phase deals
# no damage (`engine/attack.mjs#dealsNoDamage`).
#
# It did not used to. Every Noble Phantasm resolves through `resolveAttack` and
# the Combat Process always runs its damage stage, so `baseSpecFor` fell back to
# the caster's NORMAL ATTACK -- opening the Labyrinth dealt Asterios's full
# BA(STR) 170 plus a crit roll. Measured live at 203. Four other authored Noble
# Phantasms had the same hole.
field:
  # Axis 1 -- geometry. Anchored where it was cast; it does not follow Asterios.
  geometry:
    kind: fixedArea
    shape: { kind: square, size: 9 }
    # "If the Region is Greece, it affects an 11x11 panel area instead." Read by
    # `engine/fields.mjs#regionSizedShape` against the war Region -- it had no
    # reader at all until Asterios was finished, so his home-ground clause was
    # authored, compiled and inert.
    regionSizeOverride: { greece: 11 }
  # Axis 5 -- duration, with paid extension. An attrition engine: Asterios burns
  # his own Health to keep the trap shut while the trapped burn theirs escaping.
  duration: "4◈"
  extension:
    cost: { kind: health, amount: 200, payer: owner }
    grants: "2◈"
    repeatable: true
    sideEffects:
      - { kind: applyEffect, target: enemiesInside, effect: { id: atkDwn, magnitude: 20, npMagnitude: 10 }, duration: "1◈" }
      - { kind: applyEffect, target: enemiesInside, effect: { id: defDwn, magnitude: 20 }, duration: "1◈" }
  # Axis 2 -- membership. Free to enter, and the escape ladder to leave.
  membership:
    enemyEntry: free
    enemyExit: rollRequired
    allyEntry: free
    allyExit: free
    escape:
      baseChance: 20
      formula: "1d20"
      onFailure: randomRelocate
      chanceIncreasePerFailure: 5
      requiresBorderContact: true
      requiresRemainingMove: true
      # The clause that makes this a puzzle rather than a soft lock: one unit
      # escaping unlocks its team, so the play is to concentrate attempts.
      veteranBonus: { baseChance: 100, noMovPenalty: true, leadsAdjacentAllies: true }
  # Axis 3 -- isolation. Total, both directions.
  isolation:
    outsideCanTargetInside: false
    insideCanTargetOutside: false
    outsideCanApplyEffectsInside: false
    visibilityAcrossBoundary: full
  # Axis 4 -- interior rules.
  interior:
    - { key: MovDelta, value: 4, relations: [self] }
    - { key: MovDelta, value: -2, minimum: 2, relations: [enemy] }
  # Axis 6 -- vulnerability.
  vulnerabilities:
    - { kind: ownerDefeat, result: end }
phases:
  # The Labyrinth itself. The `field:` block above declares six axes and NOTHING
  # OPENED IT: `createField` is a phase kind (`engine/skill-use.mjs`), and this
  # Noble Phantasm had no phase that named it -- so the most elaborate bounded
  # field in the corpus resolved as a pair of debuffs on an empty board and the
  # Labyrinth never existed. EMIYA's Unlimited Blade Works has always carried
  # the phase; this one never did.
  #
  # `target: self` because the phase conjures from the caster, and the targeting
  # above deliberately resolves to enemies only.
  - kind: createField
    target: self
  # Clause 2, on the enemy Units the targeting resolved.
  - kind: applyEffects
    rules:
      - { effect: { id: atkDwn, magnitude: 40, npMagnitude: 20 }, duration: "2◈" }
      - { effect: { id: defDwn, magnitude: 40 }, duration: "2◈" }
