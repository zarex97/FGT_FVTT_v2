# Semiramis, char_orig_sheets/Copia de Semiramis.md, lines 84-85
#
# The `whenAllyAttacked` reaction window (`rules/reactions.mjs`'s
# `allyReactions`) already exists for exactly this shape -- EMIYA's Rho Aias
# is the reference case, and this ability needed none of its NP-only
# restriction or its ownerLoss/decay clauses, just the plain barrier pool.
schema: 1
id: semiramis-scales-of-the-sacred-fish
name: "Scales of the Sacred Fish"
rank: null
isSpell: true
category: spell
kind: skill
cooldown: "3◈"
# A Spell, but NOT an attack. `isSpell` is one of the three things
# `classifyAbility` treats as attack-shaped, and left to that this spends her
# Attack for the Turn and opens a Combat Process against the ALLY it shields --
# whose `baseSpecFor` fallback then computes Normal Attack damage for an ability
# that authors none. That is the failure EMIYA's Reinforcement records in its
# own comment, and this file had it too; found by the corpus-wide guard added
# with Nursery Rhyme.
countsAsAttack: false
timing: { window: whenAllyAttacked, radius: 2 }
description: |
  Spell. Used at the start of a Combat Phase when Semiramis or an allied Unit within a 2 panel
  area of herself is Attacked; the Unit gains the @effect[scalesShield]{Shield} (200) buff for 2◈ Turns. Cooldown: 3◈
  Turns.
shield:
  health: 200
targeting:
  anchor: { kind: targetUnit, range: 2 }
  shape: { kind: unit }
  selection: { relations: [ally, self], includeSelf: true, chooser: all }
phases:
  - kind: applyEffects
    target: reuse
    effects:
      - { id: scalesShield, duration: "2◈" }
