# Raikou, char_orig_sheets/Copia de Raikou.md
#
# Karna's Mana Burst (Flames) clause for clause, with four substitutions:
# fire->lightning, Burn->Shock, a self-Dodge tail, and a mode gate that is
# INVERTED -- Karna has none, and hers refuses while Mad Enhancement is on.
# Every decision `karna-mana-burst-flames.yml` records applies here; read it
# before changing anything in this file.
#
# The combined Base Attack is docs/06-stats-and-resources.md §6.7: 150 + 200 =
# 350, and her sheet writes the answer out ("e.g. BA=350") as his does.
schema: 1
id: raikou-mana-burst-lightning
name: "Mana Burst (Lightning)"
rank: A
kind: skill
slug: manaBurstLightning
# An ATTACK SKILL: its Active performs a Normal Attack, so it opens a Combat
# Process and spends her Attack for the Turn (§15.1).
isAttackSkill: true
element: lightning
cooldown: "3◈"
timing: { window: ownTurn }
description: |
  (Passive) Raikou is Immune to @effect[shock]{Shock}. All Lightning damage taken is reduced by 50%
  including NP.
  (Active) Can only be used when @ability[class-mad-enhancement]{Mad Enhancement} is not Active. This Skill is used when
  Raikou performs a Normal Attack. For that Combat Process, the Base Attack used is her BA(STR)
  and BA(MAG) combined (BA=350), and the Attack inflicts Shock for 2◈ Turns. Not affected by
  @ability[class-magic-resistance]{Magic Resistance}. Lightning damage (half). Then, applies @effect[dodge]{Dodge} to herself for ⅓◈ Turns.
  Cooldown: 3◈ Turns.
requirements:
  # "Can only be used when Mad Enhancement is not Active." The inverse of
  # Penthesilea's Outrage Amazon, and the shape of the whole kit: this Skill
  # and Tenmokaikai belong to the calm half, Thunder God's Embodiment and
  # Dohatsu Tenshou to the mad one. Stated here rather than trusted to the
  # player, because an unauthored gate is a Skill usable in either state --
  # which is exactly what Penthesilea's Noble Phantasm silently was.
  - { kind: modeInactive, mode: madEnhancement }
targeting:
  anchor: { kind: targetUnit, range: 4 }
  shape: { kind: unit }
  selection: { relations: [enemy], chooser: chosen, count: 1 }
damage:
  # "Her BA(STR) and BA(MAG) combined (e.g. BA=350)" -- 150 + 200, both at full
  # weight. Two sources rather than a `component`, because the number is the sum
  # and `baseSpecFor` would otherwise build it from one of them.
  base:
    sources:
      - { unit: self, component: str, factor: 1 }
      - { unit: self, component: mag, factor: 1 }
  # What the attack COUNTS AS. `str`, because "not affected by Magic
  # Resistance" is stated separately below and is the clause that would
  # otherwise be doing this work -- and because Magic Resistance's own
  # Instakill/Death exemption reads `attack:component`, so the two must not
  # disagree.
  #
  # It also decides which half of Mad Enhancement's clause 3 would apply, which
  # is moot here (the Skill refuses while ME is on) and would not be if the
  # gate were ever relaxed.
  component: str
  # "Not affected by Magic Resistance." Stage 11 is skipped entirely rather
  # than reduced; without it, a Rank C Magic Resistance would negate the MAG
  # half of a 350 Base Attack outright.
  ignoresMagicResistance: true
  # "Lightning damage (half)." Read by the pipeline's stage 4b: element-scoped
  # modifiers reach only the half of the total that carries the element --
  # which matters here in BOTH directions, because her own passive below halves
  # Lightning taken and a mirror match would otherwise resolve wrongly.
  element: lightning
  elementFraction: 0.5
phases:
  - kind: damage
  - kind: applyEffects
    rules:
      # "The Attack inflicts Shock for 2◈ Turns." `damageDealt` is the rung
      # that fires once the attack has LANDED -- which, since the R7
      # correction, includes a hit whose total was reduced to zero.
      #
      # Note the difference from Karna's, whose sheet says "if the Attack is
      # not Evaded": hers states the inflict unconditionally, and an evaded
      # attack never reaches this rung anyway.
      - key: OnEvent
        event: damageDealt
        effect: { id: shock }
        duration: "2◈"

  # "Then, applies Dodge to herself for ⅓◈ Turns." A separate phase targeting
  # self, because the clause reaches her and not the Defending Unit -- the same
  # split Quetzalcoatl's Charisma of the Sun makes for its third clause.
  #
  # UNCONDITIONAL on the attack landing: the sheet says "then", and she is
  # covered whether or not the swing connected.
  - kind: applyEffects
    target: self
    effects:
      - { id: dodge, duration: "⅓◈" }
passiveRules:
  # Passive 1. She calls the lightning down; standing in it would be absurd --
  # and her own Sakata copy throws Lightning with a 50% Shock rider, so a
  # mirror match would otherwise stun her with her own weather.
  - key: Immunity
    effect: shock

  # Passive 2. "All Lightning damage taken is reduced by 50% including NP."
  #
  # `Ward`, not `defUp`: a Ward is the category-predicated reduction (§24.3
  # Group 2) and lands in the same stage-4 bucket, which keeps it additive
  # against Atk Up the way §13.4 requires. `npValue` equals `value` because the
  # sheet says "including NP" rather than giving a reduced NP figure.
  - key: Ward
    value: 50
    npValue: 50
    predicate: ["attack:element:lightning"]
