#
# > "(Active) Used during your Turn. Has the following effects- 1. Applies Guts
# > (Fearsome) to Vlad for ⅓◈ Turns, when Vlad is defeated he is revived with
# > 20% of his Max Health. This Guts buff stacks with other normal Guts buffs.
# > 2. Applies Guts to Vlad for 1◈+⅔◈ Turns, when Vlad is defeated he is
# > revived with 20% of his Max Health. 3. Applies NP Regen for 1◈ Turns, NP
