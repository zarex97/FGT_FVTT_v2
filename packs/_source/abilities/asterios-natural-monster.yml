# Asterios, char_orig_sheets/Copia de Asterios.md
schema: 1
id: asterios-natural-monster
name: "Natural Monster"
rank: "A++"
cooldown: "4◈-⅔◈"
# Scáthach cannot copy this (§15.7). Her sheet's exclusion list is about the
# CATEGORY rather than the four names it happens to give: "Skills that a
# Servant is physically born with (e.g. Natural Body) or are part of their
# physical bodies (e.g. Mystic Eyes)". "The source of Asterios' inhuman STR and
# END" is exactly that -- it is his body, not a technique.
copyable: { allowed: false, reason: physical }
description: |
  (Passive) The source of Asterios' inhuman STR and END.
  (Active) Applies Off.Debuff ResUp for 1◈ Turns (chance of being inflicted by Offensive
  Debuffs reduced by 100%) and Def Up for 1◈ Turns (all damage taken reduced by 40%;
  if NP, 20%).
phases:
  # Effect SPECS, not rule elements. `applyPhaseEffects` reads `rule.effect` and
  # `rule.duration` and never looks at `key` -- the `key: OnEvent, event:
  # abilityUsed` these used to carry existed only to satisfy a validator that
  # classified an `applyEffects` phase's entries as rule elements, and it read as
  # an event handler that fires on any ability use. It never was one.
  - kind: applyEffects
    rules:
      - { effect: { id: offDebuffResUp, magnitude: 100 }, duration: "1◈" }
      - { effect: { id: defUp, magnitude: 40, npMagnitude: 20 }, duration: "1◈" }
