# Penthesilea, char_orig_sheets/Copia de Penthesilea.md
schema: 1
id: penthesilea-howl-of-the-war-god
name: "Howl of the War God"
rank: "A+"
cooldown: "4◈-⅓◈"
description: |
  (Active) 1. Allied Units within 2 panels gain Atk Up (STR) for 1◈ Turns: damage dealt which
  uses Base Attack (STR) is increased by 30%; if NP, 20%.
  2. Penthesilea gains Atk Up (GreekMale) for 1◈ Turns: damage dealt to Male Units from the
  Greece region is increased by 100% including NP.
activeRules:
  # Clause 1 — an aura, because "allied Units within a 2 panel area" is the same
  # positional question Charisma asks. Component-scoped to STR.
  - key: Aura
    modifierKey: atkUp
    component: str
    radius: 2
    relations: [ally, self]
    value: 30
    npValue: 20
    stacking: highestOnly
  # Clause 2 — hers alone, and conditioned on WHO is being hit. The predicate
  # is carried through to the pipeline and evaluated per attack, which is what
  # `region:` and `attribute:` options are for.
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    value: 100
    predicate: ["target:attribute:male", "target:region:greece"]
