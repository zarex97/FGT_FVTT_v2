# Treasury of Babylon, Rank EX (#232). Arturia's Radiant Road: a cooldown phase
# on himself, then the buff. "Gilgamesh's NP Cooldown" names no NP and reaches
# every one of his (#197 reading 6); the order is the sheet's ("then").
schema: 1
id: proto-gil-treasury-of-babylon
name: "Treasury of Babylon"
rank: EX
kind: skill
slug: treasuryOfBabylon
cooldown: "4◈"
timing: { window: ownTurn }
countsAsAttack: false
copyable: { allowed: false, reason: named }
description: |
  (Active) Used during your Turn. Reduce Gilgamesh's NP Cooldown by 1◈ Turns, then applies
  @effect[critUp]{Crit Up} for 1◈ Turns, Crit Chance is increased by 60%. Cooldown: 4◈ Turns.
phases:
  - kind: cooldown
    target: self
    changes:
      - { unit: self, scope: np, ticks: "1◈", direction: down }
  - kind: applyEffects
    target: self
    effects:
      - { id: critUp, magnitude: 60, duration: "1◈" }
