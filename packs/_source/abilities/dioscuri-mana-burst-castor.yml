# Castor, char_orig_sheets/Copia de Dioscuri.md
#
# TWO files despite the shared name, because the LAST clause differs: his
# reduces his NP Cooldown, hers applies Evade. The shared name still puts both
# on one clock, which is the intended reading of *"the Skill enters Cooldown for
# both of them."*
#
# BA = 300, and it is 300 on BOTH sheets -- Castor's 150/150 needs no
# correction. Pollux's file records why hers reads 300 rather than her sheet's
# printed 350.
schema: 1
id: dioscuri-mana-burst-castor
name: "Mana Burst (Light/Ancient)"
rank: "A+"
kind: skill
slug: manaBurst
# An ATTACK SKILL: its Active performs a Normal Attack, so it opens a Combat
# Process and spends Castor's Attack for the Turn (Ch. 17).
isAttackSkill: true
element: light
cooldown: "3◈-⅓◈"
timing: { window: ownTurn }
description: |
  (Active) This Skill is used when performing a Normal Attack. First, either restore 2 Agility and
  2 Luck to Castor; or restore 1 Agility and 1 Luck to both Castor and Pollux. Then, for that
  Combat Process, the Base Attack used is Castor's BA(STR) and BA(MAG) combined (BA=300). Not
  affected by @ability[class-magic-resistance]{Magic Resistance}. Light damage (half). This Attack has a 50% chance of inflicting
  @effect[blind]{Blind} on the DU for 1◈ Turns. Then, reduce Castor's NP Cooldown by 1◈ Turns.
  Cooldown: 3◈-⅓◈ Turns.
targeting:
  anchor: { kind: targetUnit, range: 3 }
  shape: { kind: unit }
  selection: { relations: [enemy], chooser: chosen, count: 1 }
damage:
  # "BA(STR) and BA(MAG) combined (BA=300)" -- 150 + 150, both at full weight.
  # Two sources rather than a `component`, because the number is the sum and
  # `baseSpecFor` would otherwise build it from one of them.
  base:
    sources:
      - { unit: self, component: str, factor: 1 }
      - { unit: self, component: mag, factor: 1 }
  # What the attack COUNTS AS. `str`, for the reason `karna-mana-burst-flames`
  # records: "not affected by Magic Resistance" is stated separately below and
  # is the clause doing that work, and Magic Resistance's own Instakill/Death
  # exemption reads `attack:component`, so the two must not disagree.
  component: str
  ignoresMagicResistance: true
  # "Light damage (half)." Read by stage 4b: an element-scoped modifier reaches
  # only the half of the total that carries the element.
  element: light
  elementFraction: 0.5
phases:
  # "First, EITHER ... OR ..." -- a player decision, and the first branching
  # `choose` in the corpus. It runs BEFORE the damage, as the sheet orders it:
  # the Agility restored may be what survives the counter.
  - kind: choose
    prompt: "FGT.Dioscuri.ManaBurstChoice"
    options:
      - id: self
        label: "FGT.Dioscuri.SelfRestore"
        phases:
          - kind: statChange
            target: self
            changes:
              - { stat: agility, delta: 2, clamp: true }
              - { stat: luck, delta: 2, clamp: true }
      - id: both
        label: "FGT.Dioscuri.SplitRestore"
        phases:
          - kind: statChange
            # Both members. The partner is reached wherever she stands -- the
            # clause names no range at all.
            target: linkedGroup
            changes:
              - { stat: agility, delta: 1, clamp: true }
              - { stat: luck, delta: 1, clamp: true }
  - kind: damage
  - kind: applyEffects
    target: reuse
    effects:
      - { id: blind, duration: "1◈", chance: 50 }
  # "Then, reduce Castor's NP Cooldown by 1◈ Turns." `ticks`, not `delta`: this
  # one IS a ◈ expression, unlike Self-Replenishment's literal 2 Turns.
  - kind: applyEffects
    target: self
    rules:
      - { key: CooldownDelta, scope: np, ticks: "1◈" }
