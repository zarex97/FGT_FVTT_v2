# Medusa, char_orig_sheets/Copia de Medusa.md
#
# "Base Attack (MAG) is used. Hits a 1x13 or 13x1 panel area in a straight line
# in any direction (including diagonal) next to Medusa for 4x damage plus 100.
# Then, applies Crit Up for 1◈ Turns, Crit Chance is increased by 30%. Not
# affected by Magic Resistance. Cooldown: 7◈+⅓◈ Turns.
#  Note: Hits in both directions (Front and back); but only hits in one
#  direction (Front) if playing on the Large Board."
schema: 1
id: medusa-bellerophon
name: "Bellerophon: Bridle of Chivalry - Pegasus"
isNP: true
kind: noblePhantasm
slug: bellerophon
rank: "A+"
npTags: [antiArmy]
cooldown: "7◈+⅓◈"
description: |
  Base Attack (MAG) is used. Hits a 1x13 or 13x1 panel area in a straight line in any direction
  (including diagonal) next to Medusa for 4x damage plus 100. Then, applies @effect[critUp]{Crit Up} for 1◈
  Turns, Crit Chance is increased by 30%. Not affected by @ability[class-magic-resistance]{Magic Resistance}.
  Cooldown: 7◈+⅓◈ Turns.
targeting:
  anchor: { kind: selfEdgeAdjacent }
  shape:
    kind: line
    length: 13
    width: 1
    # "in any direction (including diagonal)" -- eight ghost previews rather
    # than four. The geometry always handled a diagonal; the picker did not.
    directions: all
    # Ruled 2026-10-05 (#184 reading 16): the sheet's note "Hits in both directions
    # (Front and back) ... only one direction (Front) on the Large Board" is set
    # aside for every character for now. One line, in the direction chosen, on
    # any board.
  # "Hits a 1x13 or 13x1 panel area" names no relation, so it hits everyone on
  # the line, her own side included (#188 reading 11; EMIYA's Caladbolg II is
  # the precedent). Medusa stands beside the line, never on it.
  selection: { relations: [enemy, ally, neutral], chooser: all, includeSelf: false }
damage:
  multiplier: 4
  flatBonus: 100
  component: mag
  ignoresMagicResistance: true
phases:
  - kind: applyEffects
    when: afterDamage
    target: self
    rules:
      - { effect: { id: critUp, magnitude: 30 }, duration: "1◈" }
