# Semiramis, char_orig_sheets/Copia de Semiramis.md
#
# Purely descriptive: the mechanical effect of "having" this Skill lives on
# the SERVANT's `summonVariant` block (`rules/summon-variant.mjs`), resolved
# once at summon and applied as real schema overrides (Range, normal-attack
# mode, Sustainability) rather than as ability rule elements re-evaluated
# every time. That is what "changes the SHAPE of her data, not a conditional
# effect on a fixed shape" (docs/05) means in practice: nothing here needs a
# `self:variant:dsc` predicate, because a Servant who rolled Tails never has
# this ability's Passive 1 apply in the first place -- her Range and normal
# attack were never 3-panel/rangeBanded to begin with.
schema: 1
id: semiramis-double-summon-caster
name: "Double Summon: Caster"
rank: B
kind: classSkill
passive: true
copyable: { allowed: false, reason: classSkill }
description: |
  (Trigger) When Semiramis is summoned, Flip a Coin. If Heads, she is summoned with the
  'Double Summon: Caster' Skill (i.e. this Skill). If Tails, she does not have this Skill.
  (Passive 1) If Semiramis has Double Summon: Caster, her Range is 3 panels, 1 target. At a
  Range of 1 to 2, her Normal Attacks use Base Attack (STR). At a Range of 3 or higher, her
  Normal Attacks use Base Attack (MAG).
  (Passive 2) If Semiramis does not have Double Summon: Caster, her Range is 2 panels, 1
  target. Normal Attacks use Base Attack (STR).
  (Passive) Semiramis is both a 'Caster' and 'Assassin' Class Servant.
