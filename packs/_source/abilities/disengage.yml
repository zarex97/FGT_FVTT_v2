# Disengage, the ranked template (#339 ruling 3).
#
# > "(Active) This Skill is used at the start of a Combat Phase when Cú is
# > Attacked. The enemy Unit's Attack is cancelled, Cú is allowed to Move 3
# > panels, then he restores his Health by 15% of its maximum value and removes
# > 1 debuff from himself. Cooldown: 2◈ Turns." (Cú Chulainn, Rank C)
#
# One Skill at three Ranks, each bearer passing its own figures beside the ref:
#
#   | Rank | Holders               | move | heal | removes | cooldown |
#   | C    | Cú, Cú (Caster)       | 3    | 15   | 1       | 2◈       |
#   | B    | Hector                | 4    | 20   | 2       | 3◈       |
#   | A    | Siegfried, Darius III | 5    | 25   | 0 (all) | 3◈       |
#
# `removes: 0` is "all debuffs": a `pick` of 0 asks nothing and takes them all.
# The debuffs are its user's pick, never an Unremovable one.
#
# The window is Vlad III's `defendingPhaseStart` (#206, #330); the cancellation
# is Hassan's Battle Retreat's rule (#226 readings 12, 24), at the Phase's start:
# a targeted Attack is cancelled whole, an area one its user alone leaves, and
# the attacker's Attack is spent either way (#339 ruling 2,
# `engine/attack.mjs#resolveAttack`). Move first, then the heal and the removal
# (DE.order): the phases' order.
#
# Each bearer passes the sheet's own text as `description` beside the ref.
schema: 1
id: disengage
name: "Disengage"
kind: skill
slug: disengage
parameterized: [rank, move, heal, removes, cooldown]
rank: "@rank"
cooldown: "@cooldown"
timing: { window: defendingPhaseStart }
withdrawsWhenDefending: true
description: |
  (Active) Used at the start of a Combat Phase when this Unit is Attacked. The enemy Unit's Attack is
  cancelled; this Unit may Move, then restores Health and removes debuffs from itself, by its Rank.
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all, count: 1 }
phases:
  # "allowed to Move 3 panels": up to 3, its pick, by an ordinary path.
  # Declining is staying where it is.
  - kind: move
    target: self
    panels: "@move"
  - kind: heal
    target: self
    percentOfMax: "@heal"
  - kind: removeEffect
    target: self
    selector: { polarity: debuff }
    pick: "@removes"
