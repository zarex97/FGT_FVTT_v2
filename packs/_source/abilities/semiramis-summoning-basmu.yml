# Semiramis, char_orig_sheets/Copia de Semiramis.md, lines 87-90
#
# Only clause 1 (the damage-spell branch, used when NOT within the HGoB) is
# authored here. Clause 2 (summon a Bašmu, used WITHIN the HGoB) is deferred
# to Phase 8 along with the platform it needs to exist at all -- and unlike
# Double Summon's two phases, the two clauses here carry DIFFERENT cooldowns
# (2◈ vs 4◈, line 105), which needs a real design decision (a computed
# cooldown keyed on which branch actually fired, the same shape Medea's
# Dragon Tooth Warriors' `countFrom: summonCount` already is) rather than a
# half-built guess now.
#
# "Can only be used when Semiramis has the 'Double Summon: Caster' Skill" --
# true whether that is her PERMANENT variant or her temporary DSC buff
# (Double Summon's own third clause), so the gate is `anyOf` over both rather
# than `self:variant:dsc` alone.
schema: 1
id: semiramis-summoning-basmu
name: "Summoning: Bašmu"
rank: null
isSpell: true
category: spell
cooldown: "2◈"
timing: { window: ownTurn }
requirements:
  - { kind: predicate, predicate: [{ anyOf: ["self:variant:dsc", "self:effect:dscBuff"] }] }
description: |
  Spell. Can only be used when Semiramis has the 'Double Summon: Caster' Skill. Has different
  effects depending on whether Semiramis is within her 'Hanging Gardens of Babylon' or not.
  1. If used when she is not within her HGoB: Damage Spell. Hits a 3x3 panel area within Range
     for 25% extra damage and inflicts Poison. Cooldown: 2◈ Turns.
  2. If used when within her HGoB: Semiramis summons a Bašmu on a panel directly next to her.
     Counts as her Attack for the Turn. Cooldown: 4◈ Turns.
targeting:
  anchor: { kind: withinRange, metric: chebyshev }
  shape: { kind: square, size: 3 }
  selection: { relations: [enemy], chooser: all }
damage:
  multiplier: 1.25
  component: mag
phases:
  - kind: damage
    target: reuse
  - kind: applyEffects
    target: reuse
    effects:
      - { id: poison }
