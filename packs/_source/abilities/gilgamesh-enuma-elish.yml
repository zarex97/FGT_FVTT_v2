# Enuma Elish: The Star of Creation that Split Heaven and Earth, Rank EX (#374).
#
# Beside him and turnable: the sheet's missing "next to" is a typo (reading 13). Every
# Unit in it is hit. Against a Servant its 5x is doubled, Rama's shape (14), unless the
# Servant is on the list (15, 29): printed name, sheet, content id. A row whose Servant
# is not built holds the id its sheet will take, and `gilgamesh-374.test.mjs` holds the
# roster to it. Three names have no sheet yet. The struck Karl der Große is on no row.
#
# Its lists are by content id, never words inside a name (reading 30), and
# `rules/listed-abilities.mjs` reads them. An area he stands in at the declaration ends
# once the damage has landed, whoever owns it (18). A DU it hit who carries a listed
# ability takes the seal, and what that ability caused leaves every Unit (17, 19, 20).
# Nameless Forest's Tokens go first (23). "Reality Marble in its name" can only be a
# printed tag (24). Gully Trap Funny Muryan waits for Kazuradrop (22).
schema: 1
id: gilgamesh-enuma-elish
name: "Enuma Elish: The Star of Creation that Split Heaven and Earth"
rank: EX
isNP: true
npTags: [antiWorld]
kind: noblePhantasm
slug: enumaElish
cooldown: "8◈"
timing: { window: ownTurn }
copyable: { allowed: false, reason: named }
sameRoundExclusive: [gilgamesh-gate-of-babylon]
description: |
  Sword of Rupture, Ea. Base Attack (MAG) is used. Hits a 3x6 or 6x3 panel area in any non-diagonal direction next to
  Gilgamesh for 5x damage. Damage dealt to Servants (with some exceptions, listed below) is further increased by 100%.
  If Enuma Elish is used within a Reality Marble or on certain Units with a Reality Marble, this NP has additional
  effects at the end of the Damage Step (the full list can be found below). Cooldown: 8◈ Turns.
  Note: The Active effect/usage of Gate of Babylon cannot be used on the same Round as Enuma Elish, and vice-versa.

  List of Servants who do not take extra damage from Enuma Elish- 「 」, Charlemagne, Lord Logres, Melusine (both),
  Romulus (normal), Demeter (Erinyes), Nikola Tesla, Altera the San(ta), Asagami Fujino, Napoleon, Tiamat (both),
  Francis Drake, Leonardo da Vinci (Young), Mozart, Artoria Caster, Mysterious Heroine X (both), Ryougi Shiki,
  Mysterious Heroine X Alter, Shizuki Soujuurou, Sherlock Holmes, Space Ishtar, Ranmaru X, Archetype:Earth, BB Dubai,
  Kishinami Hakuno, Azumi no Isora, Abigail Williams (all), Voyager, Kukulkan, Super Aoko, Oberon Vortigern,
  Phantasmoon, Dante Alighieri, Sodom's Beast/Draco/Harlot, Space Ereshkigal, U-Olga Marie, Beast III/R (Rapture), Beast
  III/L (Lapse), Beast IV/L (Yaskaya), Beast VII (President).

  List of abilities which cause additional effects from Enuma Elish-
  Depletion Garden, Golem Keter Malkuth, Ionioi Hetairoi, Papiyas/Dairokuten Maou Hajun, Puppet Playground/Kugutsu
  Yūen, Shimabara Jigoku, Overload, Unlimited Blade Works, Aestus/Nuptiae Domus Aurea, Chaos Labyrinthos, Diatrekhōn
  Astēr Lonkhē: Duel Field, Hakuro Jyou no Hyakki Hachitendou-sama, Ramesseum Tentyris: If Gilgamesh uses Enuma Elish
  while he is inside the NP area, the NP is forcefully ended.
  Bug Space: If the Unit with this Skill is affected by Enuma Elish, it is inflicted with Skill Seal (Ea) for 3◈ Turns.
  Skill Seal (Ea) is Unremovable and ignores Debuff Immune/Resist effects on the DU, but only affects the Skill listed
  here, negating all its effects including Passive effects (i.e. if the affected Unit has other Skills not listed here,
  they can still be used). Additionally, remove all effects caused by this Skill from all Units on the field who had
  been applied with them.
  Airavata King Size, Alf Layla wa-Layla, Chariot My Love, Cursed Cupid Cleanser, De Sterrennacht, Dimension of Steam,
  Emotional Engine - Full Drive, Metabole Piglets, Tsumukari Muramasa, Unlimited Lost Works, Lai Rhyme Goodfellow: If the
  Unit with this NP is affected by Enuma Elish, it is inflicted with NP Seal (Ea) for 3◈ Turns. NP Seal (Ea) is
  Unremovable and ignores Debuff Immune/Resist effects on the DU, but only affects the NP listed here, negating all its
  effects including Passive effects (i.e. if the affected Unit has other NP not listed here, they can still be used).
  Additionally, remove all effects caused by this NP from all Units on the field who had been applied with them.
  Gully Trap Funny Muryan/Atomicros Muryan Foot: If Gilgamesh is caught within Bug Space, during his Player's Turn, he
  can use Enuma Elish if it is not on Cooldown (Note: Counts towards the number of Units which Attack during this
  Turn!). In this case, all Units caught within Bug Space are released and placed on random panels within a 2 panel area
  around the DU, then the DU is inflicted with NP Seal (Ea) for 3◈ Turns. Additionally, remove all effects caused by
  this NP from all Units on the field who had been applied with them.
  Nameless Forest: If the Unit with this NP is affected by Enuma Elish, remove all Nameless Forest Tokens from all Units
  on the board, then the DU is inflicted with NP Seal (Ea) for 3◈ Turns.
  Other abilities with Reality Marble in its name: If it is the type of ability to deploy an area, that area is
  immediately ended if Gilgamesh uses Enuma Elish while within that area. Otherwise, a Unit with that ability who is
  affected by Enuma Elish is inflicted with Skill Seal (Ea) and/or NP Seal (Ea) for 3◈ Turns, depending on whether that
  ability was a Skill and/or NP.
