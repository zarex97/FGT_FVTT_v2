# Achilles, char_orig_sheets/Copia de Achilles.md
#
# The only ability in either roster refused by BOTH a Skill Seal and an NP Seal.
# That reads like a contradiction in the vocabulary -- a Skill is not a Noble
# Phantasm -- until you notice it is the Active half of `Dromeus Komētēs`, which
# is one. His sheet lists it separately and gates it on both, so both are here.
schema: 1
id: achilles-runner-comet
name: "Runner Comet"
rank: "A+"
kind: skill
slug: runnerComet
cooldown: "3◈-⅓◈"
# "at the start of a Combat Phase" -- not his Turn. `combatPhaseStart` is the
# same window `Riding`'s dismount transition uses, and the only other thing in
# the corpus that opens there.
timing: { window: combatPhaseStart }
countsAsAttack: false
description: |
  (Active) Can only be used when Unmounted and at the start of a Combat Phase. Restore 3 Agility,
  then applies @effect[nAtkUp]{N.Atk Up} for that Turn, Normal Attack damage dealt is increased
  by 30%; and @effect[critDmUp]{Crit DmUp} for that Turn, Crit Damage dealt is increased by 30%.
  Cannot be used if Achilles is affected by @effect[skillSeal]{Skill Seal} or
  @effect[npSeal]{NP Seal}. Cooldown: 3◈-⅓◈ Turns.
requirements:
  - { kind: stance, stance: dismounted }
  # Both Seals, because his sheet names both. `notHasEffect` refuses the press
  # rather than letting it be pressed and do nothing.
  - { kind: notHasEffect, effectId: skillSeal }
  - { kind: notHasEffect, effectId: npSeal }
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all, count: 1 }
phases:
  # The Agility first, and the buffs after: the restore is not conditional on
  # them and the sheet's "then" puts them second.
  - kind: resource
    target: self
    changes:
      - { key: agility, delta: 3 }
  # Two phases, one predicate apart. "The magnitude of Runner Comet is reduced
  # to 10% for both buffs" once his Heel is damaged -- a magnitude that depends
  # on a condition, which `phase.predicate` already expresses. A single phase
  # with a scaled magnitude would need a per-effect conditional the effect spec
  # does not have, and a second document would be a copy nobody updates.
  #
  # "for that Turn" is `this turn`: it expires at the end of the Turn it was
  # used in rather than surviving into the next (Ch. 07 §7.5).
  - kind: applyEffects
    target: self
    predicate: [{ not: "self:effect:heelWounded" }]
    effects:
      - { id: nAtkUp, magnitude: 30, duration: "this turn" }
      - { id: critDmUp, magnitude: 30, duration: "this turn" }
  - kind: applyEffects
    target: self
    predicate: ["self:effect:heelWounded"]
    effects:
      - { id: nAtkUp, magnitude: 10, duration: "this turn" }
      - { id: critDmUp, magnitude: 10, duration: "this turn" }
