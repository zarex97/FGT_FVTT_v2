# Penthesilea, char_orig_sheets/Copia de Penthesilea.md
schema: 1
id: penthesilea-outrage-amazon
name: "Outrage Amazon: A Hero to Die on My Rage"
isNP: true
rank: B
npTags: [antiUnit]
cooldown: "6◈"
timing: { window: ownTurn }
description: |
  Only usable when @ability[class-mad-enhancement]{Mad Enhancement} is activated. Base Attack (STR) is used. Deals 3.5x damage
  and inflicts @effect[defDwn]{Def Dwn} for 1◈ Turns, all damage received is increased by 30%.
  Cooldown 6◈ Turns.
requirements:
  # "Only usable when Mad Enhancement is activated." Stated on the sheet and
  # absent from the authoring, so her Noble Phantasm was usable in either
  # state -- and the whole shape of her kit is that the two halves exclude each
  # other: Goddess of War while calm, Outrage Amazon while raging.
  - { kind: modeActive, mode: madEnhancement }
targeting:
  # NO `range:`. Her sheet gives this Noble Phantasm no reach of its own -- *"Base
  # Attack (STR) is used"* and nothing about panels -- so it swings at whatever
  # her Range is. `anchorRange` falls through to `caster.range` when neither
  # `range` nor `rangeBonus` is stated; an absolute number is the idiom for a
  # reach the sheet prints (Karna's Discernment of the Poor is *"Range=2"*).
  #
  # It carried `range: 2`, her BASE Range frozen -- and this NP *"can only be
  # used when Mad Enhancement is activated"*, whose clause 4 is *"Range is
  # increased by 1"*. So the one state in which she may fire it is the one state
  # in which the number was wrong: 3, every time. The same defect as Heracles's
  # Nine Lives, on a Servant where the gate guarantees it (Ch. 46 §46.10).
  anchor: { kind: targetUnit }
  shape: { kind: unit }
  selection: { relations: [enemy], chooser: all, count: 1 }
  limits: { requiresZon: true }
damage:
  base: { sources: [{ unit: self, component: str, factor: 1 }] }
  multiplier: 3.5
phases:
  - kind: damage
  - kind: applyEffects
    rules:
      - key: OnEvent
        event: damageDealt
        effect: { id: defDwn, magnitude: 30 }
        duration: "1◈"
