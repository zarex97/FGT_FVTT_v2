# Scáthach, char_orig_sheets/Copia de Scáthach.md
#
# The Anti-Army Noble Phantasm, and the only ability in the reference set whose
# targets roll a save. Every part of it is unusual: the check is made by the
# DEFENDER, its difficulty is read from a rank table keyed on the defender's own
# MAG, and failing it is worse than succeeding.
schema: 1
id: scathach-gate-of-skye
name: "Gate of Skye: Gate to the Magical Realm Brimming with Death"
rank: "A+"
isNP: true
npTags: [antiArmy]
cooldown: "7◈+⅓◈"
timing: { window: ownTurn }
description: |
  Affects all of Scáthach's targets of choice within a 5x5 panel area in any non-diagonal
  direction next to her. All targeted Units perform a Luck Check; if their MAG is Rank B, the
  value rolled is reduced by 2, and if their MAG is Rank A, by 4.

  If the targeted Unit's Luck Check fails, it is inflicted with @effect[death]{Death}. If it succeeds, it
  receives 4x damage plus 100, using Scáthach's Base Attack (MAG).

  Masters can be targeted regardless of their distance from their Servant.

  Cooldown 7◈+⅓◈ Turns. Cannot be used if @ability[scathach-primordial-rune]{Primordial Rune}, @ability[scathach-wisdom-of-dun-scaith]{Wisdom of Dún Scáith} and/or
  Gáe Bolg Alternative are on Cooldown; when this NP is used, Primordial Rune and Wisdom of
  Dún Scáith enter Cooldown.
requirements:
  # "Cannot be used if Primordial Rune, Wisdom of Dún Scáith, and/or Gáe Bolg
  # Alternative are on Cooldown." Note the asymmetry the time model draws
  # attention to (Ch. 04): it is BLOCKED BY three and TRIGGERS two.
  - kind: abilityOffCooldown
    abilityIds:
      - scathach-primordial-rune
      - scathach-gae-bolg-alternative
  # "Wisdom of Dún Scáith" is the three slots with a clock -- Skill 1, Skill 2
  # and Clairvoyance -- and any one cooling blocks it (#204 reading 19). The
  # grant this named before is the button that opens the curation dialog: it
  # never cools, so a cooling slot never blocked the Gate. A second requirement
  # because a gate names abilities OR a group, never both.
  - kind: abilityOffCooldown
    exclusionSet: wisdomOfDunScaith
# "When this NP is used, Primordial Rune and Wisdom of Dún Scáith enter
# Cooldown" -- the two it triggers, which are not the three it is blocked by.
#
# The second entry is a GROUP, not an ability. "Wisdom of Dún Scáith" here means
# her three Wisdom slots -- the things with a `4◈-⅓◈` to run -- and not the
# grant itself, which is the button that opens the curation dialog and has no
# clock at all. Naming the grant put nothing on cooldown.
alsoTriggers:
  - scathach-primordial-rune
  - { exclusionSet: wisdomOfDunScaith }
targeting:
  # `selfEdgeAdjacent` is the resolver's name for exactly this: "a 5x5 area in
  # any non-diagonal direction next to the caster". The player picks one of four
  # ghost previews.
  anchor: { kind: selfEdgeAdjacent }
  shape: { kind: square, size: 5 }
  # "Targets of CHOICE" -- the area catches everyone, and Scáthach picks which
  # of them the Noble Phantasm affects.
  selection: { relations: [enemy], chooser: all, choose: true }
  limits:
    # "Masters can be targeted regardless of their distance from their Servant."
    # The key `rules/targeting/resolve.mjs` reads; it was authored
    # `ignoresMasterProtection`, which nothing read. An area already reaches a
    # guarded Master -- her pick among those the area caught is not a "chosen"
    # target there -- so the spelling changed nothing on the board. The half of
    # the clause that did was the Cover one, `damage.noCover` (#204 reading 18).
    bypassMasterProtection: true
damage:
  multiplier: 4
  flatBonus: 100
  component: mag
  # "The only way to avoid it is through succeeding at the Luck Check it
  # imposes" (#204 reading 15). No Evade, Dodge, Substitution or concealment
  # coin saves a target. A Block may answer: it cannot stop the check or the
  # Death, and cuts the 4x damage after a pass.
  unavoidable: true
  # "If a Servant fails to shove their targeted Master out of the NP area, the
  # effect of the NP is applied to the Master (Servant unable to interfere)."
  # The shove is still offered; a failed one is no Cover (#204 reading 18).
  noCover: true
  # No damage on a failed Check: that target took Death instead.
  skipIf: { effectApplied: death }
phases:
  - kind: check
    when: beforeDamage
    check: luck
    # By letter: "if their MAG is Rank B, reduce by 2; if Rank A, reduce by 4".
    # B+ takes -2, A+ and EX take -4 (#204 reading 16).
    modifierTable: gateOfSkyeSaveModifier
    modifierRank: mag
    onFail:
      effects:
        - { id: death }
