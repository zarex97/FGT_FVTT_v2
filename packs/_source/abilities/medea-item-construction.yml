# Medea, char_orig_sheets/Copia de Medea.md
#
# The severity ladder is the interesting half. Appendix A is explicit that
# `Debuff ChUp` "does not affect Instakill/Death/Erase unless stated" -- and
# this Skill states otherwise, at a halved and re-halved magnitude. So the three
# tiers are three elements filtered by `severity`, rather than one number the
# applier would have to know a rule to scale.
schema: 1
id: medea-item-construction
name: "Item Construction"
rank: A
kind: classSkill
passive: true
copyable: { allowed: false, reason: classSkill }
description: |
  (Passive) Affects all allied Units within a 2 panel area. The chance of inflicting debuffs is
  increased by 50% (Instakill 25%, Death 10%); the chance of being inflicted by debuffs is
  reduced by 50% (Instakill 25%, Death 10%).
passiveRules:
  # "Only the Item Construction with the highest Rank takes effect" -- resolved
  # across the whole GROUP by rank, and the winner keeps all six elements.
  # Comparing element values instead would let a C-rank instance win one tier
  # and lose another, blending two Skills that never existed.
  - key: Aura
    radius: 2
    relations: [ally, self]
    stacking: highestOnly
    group: itemConstruction
    elements:
      # Outgoing -- what the Unit inflicts.
      - { key: ApplicationChance, direction: outgoing, valence: offensive, severity: normal, value: 50 }
      - { key: ApplicationChance, direction: outgoing, severity: instakill, value: 25 }
      - { key: ApplicationChance, direction: outgoing, severity: death, value: 10 }
      # Incoming -- what it resists. A resistance is a POSITIVE value inward;
      # the applier subtracts it.
      - { key: ApplicationChance, direction: incoming, valence: offensive, severity: normal, value: 50 }
      - { key: ApplicationChance, direction: incoming, severity: instakill, value: 25 }
      - { key: ApplicationChance, direction: incoming, severity: death, value: 10 }
