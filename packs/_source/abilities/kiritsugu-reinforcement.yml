# Kiritsugu, char_orig_sheets/Copia de Kiritsugu.md
#
# EMIYA's Reinforcement at a higher number (40% vs 30%) and a longer cooldown
# (2◈ vs 1◈). Same father, same spell -- and the identical shape is the point:
# where two sheets say the same thing, the content should look the same.
schema: 1
id: kiritsugu-reinforcement
name: "Thaumaturgy: Reinforcement"
rank: null
kind: skill
slug: reinforcement
category: thaumaturgy
isSpell: true
cooldown: "2◈"
# "Used at the start of a Combat Phase" -- so it is offered where a reaction is,
# and on his own Turn before he swings.
timing: { window: [ownTurn, combatPhaseStart] }
# A Spell, but not an attack: it buffs and resolves. Left to `countsAsAttack`
# and it would spend his Attack for the Turn, because `isSpell` is one of the
# three things that make an ability one.
countsAsAttack: false
negatedBy: [silence]
requirements:
  - { kind: notHasEffect, effectId: silence }
description: |
  Spell. Used at the start of a Combat Phase. During this Combat Phase, Normal Attack damage
  dealt is increased by 40%. Cooldown: 2◈ Turns.
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all }
phases:
  - kind: applyEffects
    target: self
    effects:
      # N.Atk Up, not Atk Up. "Normal Attack damage" is explicit, and a blanket
      # Atk Up would quietly buff both his Noble Phantasms -- which is the whole
      # reason the two effects are separate in Appendix A.
      #
      # "During this Combat Phase" is one exchange, and ⅓◈ is the shortest the
      # tick grammar has: one Turn, the Turn the Combat Phase happens in.
      - { id: nAtkUp, magnitude: 40, duration: "⅓◈" }
