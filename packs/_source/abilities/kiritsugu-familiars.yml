# Kiritsugu, char_orig_sheets/Copia de Kiritsugu.md
#
# Two buffs that only make sense together: +2 Range takes him from 3 to 5, and
# the Crit Up applies at Range 3 or higher -- so the Spell widens the band AND
# sharpens everything inside it. Cast alone it would still be his longest reach
# in the game; cast before a shot it is his best one.
schema: 1
id: kiritsugu-familiars
name: "Thaumaturgy: Familiars"
rank: null
kind: skill
slug: familiars
category: thaumaturgy
isSpell: true
cooldown: "4◈"
timing: { window: ownTurn }
countsAsAttack: false
negatedBy: [silence]
requirements:
  - { kind: notHasEffect, effectId: silence }
description: |
  Spell. Used during your Turn. Applies the @effect[rangeUp]{Range Up} buff for 1◈ Turns, Range is
  increased by 2 panels; and applies @effect[critUpFamiliar]{Crit Up (Familiar)} for 1◈ Turns, Crit
  Chance for Attacks at a Range of 3 or higher is increased by 30%. Cooldown: 4◈ Turns.
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all }
phases:
  - kind: applyEffects
    target: self
    effects:
      - { id: rangeUp, magnitude: 2, duration: "1◈" }
      - { id: critUpFamiliar, magnitude: 30, duration: "1◈" }
