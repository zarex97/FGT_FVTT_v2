# Quetzalcoatl, char_orig_sheets/Copia de Quetzalcoatl.md
# The bounded-field model is Ch. 28; this is a point in its six axes, and it is
# structurally Jack's Mist with a placed object for an anchor.
schema: 1
id: quetz-piedra-del-sol
name: "Piedra Del Sol: The Sun Stone"
isNP: true
rank: EX
npTags: [antiArmy, antiFortress, boundedField]
kind: noblePhantasm
slug: piedraDelSol
category: quetzNP
# "Cooldown: 8◈ Turns AFTER Piedra Del Sol was deactivated" -- the clock starts
# at the field's closure, which `countFrom: deactivation` says and Jack's Mist
# already established.
cooldown: { max: "8◈", countFrom: deactivation }
timing: { window: ownTurn }
description: |
  (Non-damaging) When this NP is used, the Piedra Del Sol appears where Quetz is. While the Piedra
  Del Sol is above the field, it has the following effects-
  1. Goddess' Divine Core: All damage dealt is increased by 180; and all damage taken by Quetz is
     reduced by 50% including NP.
  2. When an enemy Unit ends its Turn within the 7x7 panel area around the Piedra Del Sol, it
     receives 50 Fire damage and is inflicted with @effect[burn]{Burn}; this Burn debuff is
     permanent as long as the Unit is within the Piedra Del Sol area. (The Piedra Del Sol area is
     categorized as 'Burning'.)
  Quetz can Move out of the Piedra Del Sol area, and the panel occupied by Piedra Del Sol can
  still be Moved onto (replace the Piedra Del Sol on top of any Units which Move onto that panel).
  After every 1◈ Turns, Quetz's Master's Health is reduced by 50 at the end of the Turn if this NP
  is Active unless the NP was deactivated during this Round. If her Master's Health drops to/is 50
  or less at any time, this NP is forcefully deactivated at the end of the Turn. This NP can be
  deactivated during Quetz's Turn or at the start or end of any Round or Turn.
  Cooldown: 8◈ Turns after Piedra Del Sol was deactivated.
targeting:
  anchor: { kind: self }
  shape: { kind: unit }
  selection: { relations: [self], includeSelf: true, chooser: all, count: 1 }
  limits: { requiresZon: true }
# Clause 1: "While the Piedra Del Sol is above the field, it has the following
# effects- 1. Goddess' Divine Core: All damage dealt is increased by 180; and all
# damage taken by Quetz is reduced by 50% including NP."
#
# RULED: "on the field" means ON THE BOARD (the author, 2026-10-01). Both halves
# hold wherever she stands for as long as the stone exists -- she may Move out of
# the area (*"Quetz can Move out of the Piedra Del Sol area"*), ride the
# Quetzalcoatlus over it, or stand at the far edge of the map -- so they are HER
# passive rules gated on the stone existing, `fieldActive`, which is a question
# about the field and not about where she is (Medusa's Blood Temple asks it of
# Blood Fort Andromeda). They were the field's `interior` rules, which held only
# while she stood inside the 7x7.
passiveRules:
  # "Goddess' Divine Core: All damage dealt is increased by 180."
  #
  # RULED: this REPLACES her Skill's +120 rather than stacking to +300. The
  # clause is headed with the Skill's own name and gives a different number,
  # which reads as the stone raising the Skill's value while it stands.
  # `supersedes` is Ch. 17's mechanism for exactly that.
  #
  # `self:`: in the damage pipeline it is the ATTACKER, which is her.
  - key: FlatDamage
    value: 180
    includesNP: true
    supersedes: [quetz-goddesses-divine-core]
    predicate: ["self:fieldActive:quetz-piedra-del-sol"]
  # "...and all damage taken by Quetz is reduced by 50% including NP."
  # `npValue` equal to `value` IS "including NP": most defensive percentages
  # are halved against a Noble Phantasm, and this one is not.
  #
  # `target:`: in the pipeline the DEFENDER, which is her -- and only her, so a
  # Master standing in the stone is not reduced.
  - key: Ward
    value: 50
    npValue: 50
    predicate: ["target:fieldActive:quetz-piedra-del-sol"]
field:
  # Axis 1 -- geometry. `fixedArea`, so it does NOT follow her: the stone is
  # placed and stays there, which is what makes *"Quetz can Move out of the
  # Piedra Del Sol area"* a sentence worth writing. The anchor is her panel at
  # cast time, which is the stone's panel, because the stone appears where she
  # is -- no `anchorRef` needed, and adding one would claim a distinction the
  # sheet does not draw.
  geometry:
    kind: fixedArea
    shape: { kind: square, size: 7 }
  # Axis 2 -- membership. Free in both directions: a hazard, not a prison.
  membership: { allyEntry: free, allyExit: free, enemyEntry: free, enemyExit: free }
  # Axis 3 -- isolation. None. It burns what stands in it; it does not cut the
  # board in two.
  isolation:
    outsideCanTargetInside: true
    insideCanTargetOutside: true
    outsideCanApplyEffectsInside: true
    visibilityAcrossBoundary: full
  # Axis 4 -- interior rules. NONE: clause 1's two halves are HERS, wherever she
  # stands, so they are `passiveRules` of this Noble Phantasm (above), gated on
  # the stone existing, and not rules of the 7x7. As `interior` rules they held
  # only while she stood inside the area, which is not what the sheet says.
  #
  # Clause 2. The generic `burning` terrain entry already inflicts an
  # unremovable, non-expiring Burn at turn end and deals fixed Fire damage
  # there; this area differs in exactly two ways -- 50 rather than 25, and
  # ENEMIES rather than everyone -- so those two are stated here and the terrain
  # does the rest.
  interiorEvents:
    - event: turnEnd
      relations: [enemy]
      onFail:
        - { key: Damage, amount: 50, element: fire, fixed: true }
        # "permanent as long as the Unit is within the area": no duration and
        # unremovable, which is also what the Burning terrain's own clause says.
        # `duration: null` is PERMANENT (an absent duration is "the effect's
        # own"), and `tiedToField` ties it to the area. *"Once it leaves the
        # area, the Burn is no longer permanent"*: ruled 2026-10-02 (#65) as an
        # ORDINARY Burn from then on -- 2◈ from leaving, removable -- and the
        # same Burn turns permanent again if the Unit walks back in while it
        # runs. `onLeave: ordinary` says so (`rules/bounded-fields.mjs#
        # revertingActionFor`); without it a tied effect ends on leaving. The
        # stone closing still takes it away (`endField`).
        - { key: ApplyEffect, effect: { id: burn }, duration: null, unremovable: true, tiedToField: true, onLeave: ordinary }
  # Axis 5 -- duration. There is none; the upkeep is what limits it.
  upkeep:
    every: "1◈"
    cost: { kind: health, amount: 50, payer: ownerMaster }
    endWhenUnaffordable: true
    # "If her Master's Health drops to/is 50 or less at any time, this NP is
    # forcefully deactivated at the end of the Turn." A STANDING threshold, read
    # at every Turn's end whether or not a toll falls due: the toll is once per
    # 1◈, and a Master at 50 or less would otherwise keep the stone open for the
    # rest of the period (#149). Also tested after a toll, so the toll that takes
    # him to 50 closes it at that same boundary.
    closeWhen: { payerHealthAtMost: 50, at: turnEnd }
  # Axis 6 -- vulnerability.
  vulnerabilities:
    - { kind: ownerDefeat, result: end }
  # NO `lockout`, unlike the Quetzalcoatlus. That is the entire difference
  # between the two sheets' final paragraphs, and it is authored rather than
  # inferred so the absence cannot read as an oversight.
  deactivation: { byOwner: true, window: any }
  onEnd:
    # The ground it painted goes with it.
    - { key: ClearTerrain, tag: "piedra:@field.id" }
phases:
  - kind: createStructure
    target: self
    structureId: piedra-del-sol
    at: caster
  - kind: createField
    target: self
  # "(The Piedra Del Sol area is categorized as 'Burning'.)" Painted rather than
  # implied, because the terrain is what gives the panels their fire and water
  # interactions -- the field's own turn-end clause is the only damage.
  #
  # `labelOnly`: ruled a LABEL. The panels are Burning to everything that asks
  # what the ground is, and Burning's own Turn-end toll (a Burn and 25 Fixed
  # Fire on EVERYONE inside, her and her Master included) does not run here.
  - kind: zone
    target: self
    spec:
      terrain: [burning]
      shape: { kind: square, size: 7 }
      anchor: { kind: self }
      followsSource: false
      duration: null
      tag: "piedra:@field.id"
      labelOnly: true
