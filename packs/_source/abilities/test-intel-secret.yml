# Test content for the Information System's live presses (#405, ADR-0008). NOT A
# CHARACTER SHEET: Mordred's Secret of Pedigree and Lancelot (Berserker)'s For Someone's Glory, as one Mode. Staged so the Clause is pressed through the real
# compile and projection before the Servant it stands for is audited.
schema: 1
id: test-intel-secret
name: "Test Intel: Secret"
isNP: true
rank: "C"
ignoresNPGate: true
isMode: true
active: true
slug: testIntelSecret
# "can only be reactivated 3◈ Turns after it was deactivated"
cooldown: { max: "3◈", countFrom: deactivation }
deactivation: { byOwner: true, window: any }
timing: { window: ownTurn }
description: "TEST NOBLE PHANTASM (Passive). While Active: Health, Agility and Luck show their Rank only, and only Parameters and Class Skills can be learned. Disabled when Test Intel: Clarent is used; reactivates 3◈ after."
activeRules:
  - key: HidesInformation
    buyable: [str, end, agi, mag, luc, classSkills]
    ranksOnly: [end, agi, luc]
passiveRules:
  # "These effects are disabled when Clarent Blood Arthur is used"
  - key: OnEvent
    event: abilityUsed
    ofContentId: [test-intel-clarent]
    automatic: true
    then:
      - { key: SetMode, ability: testIntelSecret, active: false }
