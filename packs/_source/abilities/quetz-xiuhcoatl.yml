# Quetzalcoatl, char_orig_sheets/Copia de Quetzalcoatl.md
# Data sheet: docs/D-servant-data-sheets.md §D.28
#
# Two resolutions and a fraction.
#
# The splash is NOT an area attack with a hole in it: its own anchor (the target's
# footprint, since the user's 2026-10-02 change; the sheet put it around her),
# different base attack (MAG alone, not the combined 250),
# different multiplier (1x, not 4x) and a different rider set (Burn 1◈ and NP
# Seal at 25%, against Burn 2◈ and NP Seal outright). The sheet gives four
# numbers and shares none of them, which is why this is an `aftermath` block
# rather than a wider `shape`.
schema: 1
id: quetz-xiuhcoatl
name: "Xiuhcoatl: O Flame, Burn the Gods Themselves"
isNP: true
rank: A
npTags: [antiUnit, antiFortress]
kind: noblePhantasm
slug: xiuhcoatl
category: quetzNP
cooldown: "7◈"
element: fire
timing: { window: ownTurn }
# "Xiuhcoatl cannot be used if Quetz is Riding the Quetzalcoatlus." Declared on
# BOTH sides -- the three Spells carry the mirror -- the way Karna's two
# Brahmastras do, so neither reads as a rule with a missing half.
requirements:
  - { kind: predicate, predicate: [{ not: "self:onPlatform:quetzalcoatlus" }] }
description: |
  Range+2. Base Attack (STR) and half of Base Attack (MAG) is used (BA=250), not affected by Magic
  Resistance. Deals 4x damage and inflicts @effect[npSeal]{NP Seal} for 1◈ Turns, and inflicts
  @effect[burn]{Burn} for 2◈ Turns. Fire damage (half).
  Then (regardless of whether the NP hits the DU or not), deals normal damage to all Units within
  a 2 panel area of the targeted Unit except Quetzalcoatl and the targeted Unit (Base Attack
  (MAG) is used) with a 25% chance of inflicting NP Seal for 1◈ Turns and inflicts Burn for 1◈
  Turns. Fire damage.
  Xiuhcoatl cannot be used if Quetz is Riding the Quetzalcoatlus.
  If this NP is used on a Unit within or directly next to a [Fortress] NP (regardless of ally's or enemy's),
  that NP area and the panels directly outside/next to the NP area are now 'Burning' until the
  Fortress NP is deactivated.
  Cooldown: 7◈ Turns.
targeting:
  # "Range+2" -- the user's change (ruled 2026-10-02, #65). The sheet gives this
  # NP no Range of its own; it now reaches two panels past hers (`rangeBonus`,
  # read by `anchorRange`): 4 at her statblock, and a buff or a penalty to her
  # Range still moves it. NO `metric:` -- measured by the Attack Range rule like
  # every other Range, so at 3 or more the outer ring loses its corners.
  anchor: { kind: withinRange, rangeBonus: 2 }
  shape: { kind: unit }
  selection: { relations: [enemy], chooser: chosen, count: 1 }
  limits: { requiresZon: true }
damage:
  # "Base Attack (STR) and half of Base Attack (MAG) is used (BA=250)" --
  # 125 + (250 / 2). Authored as TWO SOURCES rather than as the literal 250, so
  # a buff to either Parameter moves the half it should and no more. Under
  # `base`, the long spelling; the short one (`sources:` at the top of the
  # block) is read too since #135, when it was found being dropped for
  # `component` below -- she dealt the STR half, 500 where the sheet says 1000.
  base:
    sources:
      - { unit: self, component: str, factor: 1 }
      - { unit: self, component: mag, factor: 0.5 }
  # What the attack counts AS for a predicate. STR, because the sheet's framing
  # is her Base Attack (STR) with half her MAG added -- the same shape EMIYA's
  # ranged band uses.
  component: str
  multiplier: 4
  # "not affected by Magic Resistance." Stage 11 is skipped entirely rather than
  # reduced; without it, a Rank A Magic Resistance would negate the MAG half
  # outright.
  ignoresMagicResistance: true
  element: fire
  # "Fire damage (half)." Half the total carries the element, so a defender
  # resisting Fire resists that half and no more. Modelled rather than
  # approximated -- see the pipeline's stage 4b.
  elementFraction: 0.5
aftermath:
  # "regardless of whether the NP hits the DU or not" -- the load-bearing
  # clause. It fires on a miss, on an Evade and on a Block, so it is declared
  # alongside the primary rather than sequenced behind its outcome.
  unconditional: true
  targeting:
    # "within a 2 panel area of the targeted Unit" -- the user's change (ruled
    # 2026-10-02, #65); the sheet said "of Quetzalcoatl". Measured from the
    # target's WHOLE footprint (`primaryTarget` hands it over, and
    # `chebyshevRadius` unions around every panel of it), so a 2x2 mount's
    # splash reaches 2 past each edge.
    anchor: { kind: primaryTarget }
    shape: { kind: chebyshevRadius, r: 2 }
    selection:
      relations: [enemy, ally, neutral]
      # "except herself..." -- she can now stand inside it, and is still spared.
      # Her Master is not: Overpower's coin stays on him (ruled 2026-10-02).
      includeSelf: false
      # "...and the previously targeted Unit."
      excludePrimaryTarget: true
      chooser: all
  damage:
    # "Base Attack (MAG) is used" -- MAG ALONE, not the combined figure, and at
    # "normal damage", which is 1x. The same number as the primary by
    # coincidence and from a different source, so a buff to her STR moves one
    # and not the other.
    sources:
      - { unit: self, component: mag, factor: 1 }
    component: mag
    multiplier: 1
    # NO `ignoresMagicResistance` here, deliberately (ruled 2026-10-01): "that hit
    # on the DU is not affected by Magic Resistance" exempts the hit and nothing
    # else, so the splash IS affected. It was authored exempt, and deleting the
    # line changed nothing until an aftermath stopped inheriting the primary's
    # flag (#136); the primary above keeps its own.
    #
    # Plain "Fire damage." here, with no "(half)": the sheet distinguishes its
    # two sentences and so does this. Whole Fire, since the aftermath no longer
    # inherits the primary's `elementFraction` either.
    element: fire
  effects:
    - { id: npSeal, duration: "1◈", chance: 25 }
    - { id: burn, duration: "1◈" }
phases:
  - kind: damage
  - kind: applyEffects
    rules:
      # The PRIMARY's riders: NP Seal unconditionally and Burn for 2◈, against
      # the aftermath's 25% and 1◈ above.
      - key: OnEvent
        event: damageDealt
        effect: { id: npSeal }
        duration: "1◈"
      - key: OnEvent
        event: damageDealt
        effect: { id: burn }
        duration: "2◈"
  # "That NP area and the panels directly outside/next to the NP area are now
  # 'Burning' until the Fortress NP is deactivated."
  #
  # A [Fortress] NP is one tagged `fortress`: Ozymandias's Ramesseum Tentyris,
  # and no other -- NOT an `antiFortress` one, her own Piedra Del Sol included
  # (the author's ruling). One Burning area per Fortress in reach, each bound to
  # its field (`boundToFieldId`), so closing that Fortress -- and no other --
  # takes its Burning away; `duration: null` is "until", not "for ever".
  #
  # `from: target`: "used within or directly next to" is measured from the
  # Unit it is used on, not from her -- the user's ruling (2026-10-02, #65),
  # which goes with the longer reach.
  - kind: zone
    target: self
    spec:
      terrain: [burning]
      shape: fortressNearby
      from: target
      duration: null
