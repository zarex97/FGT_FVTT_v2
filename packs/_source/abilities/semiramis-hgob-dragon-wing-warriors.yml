# Hanging Gardens of Babylon, char_orig_sheets/Copia de Semiramis.md, lines
# 151-152.
#
# "X times, where X = 1d6+4" needed `damage.repeat` to accept `{roll}`
# alongside EMIYA's plain integer (module/engine/attack.mjs, resolved once at
# declaration). "50 Fixed STR damage" needed `damage.fixed` to actually reach
# the pipeline's own `isFixedDamage` gate, which nothing had ever set from
# content (same file).
#
# "Each instance of damage can be separately Evaded or Blocked" is exactly
# `repeat`'s existing behaviour -- one Combat Process per instance, one
# reaction ladder each. "Damaged Units only perform an Injury Roll once
# regardless of number of hits taken" is NOT modelled: each repeat is its own
# Combat Process and so still runs its own Injury Roll (`attack.mjs`'s
# `applyInjury`, keyed per chat message). Consolidating N processes' Injury
# Rolls into one is a real, separate subsystem -- tracking which processes
# belong to the same Attack declaration across N reaction ladders -- and is
# out of scope for this platform's own checkpoint. Recorded here rather than
# left to look implemented.
schema: 1
id: semiramis-hgob-dragon-wing-warriors
name: "Dragon Wing Warriors"
rank: null
kind: skill
slug: dragon-wing-warriors
isAttackSkill: true
cooldown: "1◈"
timing: { window: ownTurn }
description: |
  Range=4 plus the area under the HGoB and the area of the HGoB. Hits a 5x5 panel area within
  Range. All affected Units receive 50 Fixed STR damage X times, where X=Number rolled on a
  six-sided die plus 4. Each instance of damage can be separately Evaded or Blocked. Damaged Units
  only perform an Injury Roll once regardless of number of hits taken. Cooldown: 1◈ Turns.
targeting:
  # Measured from the HGoB's own panel(s). "Plus the area under the HGoB and
  # the area of the HGoB" is not separately modelled: Range 4 from a 9x9
  # platform's own edge already overlaps both regions in every practical case.
  anchor: { kind: withinRange, range: 4, metric: chebyshev }
  shape: { kind: square, size: 5 }
  selection: { relations: [enemy, ally, neutral], chooser: all, includeSelf: false }
damage:
  fixed: true
  base: { fixedValue: 50 }
  component: str
  repeat: { roll: "1d6+4" }
phases:
  - kind: damage
