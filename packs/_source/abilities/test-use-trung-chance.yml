# Test Attack Skill for the Use record's live presses (#320, #285, plan Task 15,
# L2-2). Test Use: Trung at 50% per debuff, so a use inflicts 0, 1, 2 or more:
# the excluded case, a use that inflicted none, keeps the base clock.
schema: 1
id: test-use-trung-chance
name: "Test Use: Trung Chance"
kind: skill
isAttackSkill: true
slug: testUseTrungChance
timing: { window: ownTurn }
cooldown:
  max: "1◈"
  countBonus:
    - { ticks: "½◈", count: { of: use, fact: debuffsInflicted } }
description: "TEST ATTACK SKILL. Hits a 3x3 area within 4 panels and inflicts @effect[atkDwn]{Atk Dwn} and @effect[defDwn]{Def Dwn} (50% each). Cooldown 1◈ plus ½◈ per debuff inflicted."
targeting:
  anchor: { kind: withinRange, range: 4, metric: chebyshev }
  shape: { kind: square, size: 3 }
  selection: { relations: [enemy, neutral], chooser: all, includeSelf: false }
  isDamagingAoE: true
damage:
  component: str
  multiplier: 1
phases:
  - kind: damage
  - kind: applyEffects
    rules:
      - key: OnEvent
        event: damageDealt
        effect: { id: atkDwn, chance: 50, magnitude: 10 }
        duration: "1◈"
      - key: OnEvent
        event: damageDealt
        effect: { id: defDwn, chance: 50, magnitude: 10 }
        duration: "1◈"
