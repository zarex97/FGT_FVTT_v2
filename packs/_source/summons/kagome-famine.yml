# Pale Rider -- Kagome Kagome: Famine.
# Conversion source: char_orig_sheets/Copia de Pale Rider.md
# Data sheet: docs/D-servant-data-sheets.md §D.26
#
# The only Spirit with a SHAPED Normal Attack: "Range: 3 panels, 3x3 panel area". Slowest and
# weakest, and the one that hits a cluster.
#
# Summoned by Doomsday Come's `contact` event (`SummonBound`), one per enemy
# Unit inside, and bound to that enemy for as long as the area stands.
schema: 1
id: kagome-famine
name: "Kagome: Famine"
type: summon
attributes: [summon, dark, spirit]
# "Health: - (Cannot be damaged)". Not a large number -- no number at all.
undamageable: true
baseHealth: null
# "Agility: Pale Rider's minus 1. Luck: Same as Pale Rider's." Numbers that are not
# numbers, resolved at placement from the summoner's live values.
inherit:
  agility: { from: summoner, delta: -1 }
  luck: { from: summoner }
mov: 4
range: { panels: 3, targets: 1 }
baseAttack: { str: 0, mag: 100 }
normalAttack:
  mode: fixed
  component: mag
  # "Range: 3 panels, 3x3 panel area" -- the only Normal Attack in the corpus
  # with a shape of its own. Read by `rules/normal-attack.mjs`, which returned
  # a single panel for every Unit in the game before this.
  shape: { kind: square, size: 3 }
# "Kagome Spirits do not count towards the number of Units that Move and/or
# Attack during your Turn. The same Kagome Spirit can only Move/Attack once per
# Turn." Two different rules, and both are stated.
countsTowardBudget: false
actsOncePerTurn: true
passiveRules:
  # "Pale Rider cannot Evade, Block, or Counter" is his; a Spirit that cannot
  # be damaged has nothing to defend either, and the rung would offer it
  # choices it can never take.
  - key: GrantedAbility
    abilities: [noReactions]

  # "Normal Attacks have a 10% chance of inflicting Death."
  - key: OnEvent
    event: damageDealt
    automatic: true
    predicate: ["attack:kind:normal"]
    then:
      - { key: ApplyEffect, target: victim, effect: { id: death }, chance: 10 }

  # "If a damage-dealing NP or Attack that deals Light damage or Attack that
  # deals extra damage to Units with the 'Dark' or 'Spirit' Attribute is used
  # on a Kagome Spirit, Flip a Coin; that Kagome Spirit disappears for 1◈ Turns
  # if Tails, and disappears for 2◈ Turns if Heads; then after that period it
  # reappears on a random panel within Doomsday Come."
  #
  # `attack:vsAttribute:` is what "deals extra damage to Dark Units" IS: a
  # property of the attacker's own active damage modifiers, read off the
  # predicates they carry rather than a tag somebody has to remember to add.
  - key: OnEvent
    event: attacked
    automatic: true
    predicate:
      - or: ["attack:element:light", "attack:vsAttribute:dark", "attack:vsAttribute:spirit"]
    then:
      - { key: Banish, coin: { heads: "2◈", tails: "1◈" } }
notes: |
  The Process still runs after a banishment and still halts at stage 0: the Spirit cannot be
  damaged, so there is nothing for the attack to do once it has driven it off.
