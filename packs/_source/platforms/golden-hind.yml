# docs/20-platforms-and-levels.md §20.5
schema: 1
id: platform-golden-hind
name: "The Golden Hind"
type: platform
description: |
  Francis Drake's ship. Activated directly as a Noble Phantasm, with an upkeep of 50 Master
  Health per Round that REPLACES the normal Noble Phantasm cost rather than stacking with it.
attributes: [large, mechanical]
baseHealth: 2500
# "Agility: 10 (Only performs Injury Roll when damaged by NP)". The
# parenthesis is the `injuryRoll` block below.
agility: 10
# "Luck: Shared with Drake" -- a number that is not a number, resolved at
# placement from the summoner's live value, the same rule and the same moment
# the Quetzalcoatlus and the Kagome Spirits use.
inherit:
  luck: { from: summoner }
mov: 6
range: { panels: 5, targets: 1 }
baseAttack: { str: 0, mag: 200 }
# Stated on the sheet, and independent of its range (Ch. 20 §20.5).
detect: 4
footprint: { w: 4, h: 3 }
capacity: 9
level: 2
# "The Golden Hind can Move onto occupied panels (when it does, place it on
# top of the figurines)."
#
# `sharesPanel`, NOT `movesOntoOccupiedPanels`: the second is Basmu's and means
# "all Units occupying said panels will be knocked back". This co-locates and
# displaces nobody, which is what "place it on top of" says.
sharesPanel: true
# Its only Base Attack is MAG 200; there is no STR column to choose from.
normalAttack: { mode: fixed, component: mag }
# "Drake's Normal Attacks are replaced with Attacks from the Golden Hind."
#
# Spec R8. The Attack ONLY -- Quetzalcoatl's mount also takes `move: true`,
# because her sheet says "Quetz's Move AND Normal Attack is replaced", and
# Drake's says only the Attack. The ship keeps its own `actsOncePerTurn`
# movement, as the Hanging Gardens do.
replacesRiderAction: { roles: [owner], normalAttack: true }
# "Drake can deactivate the Golden Hind during her Turn, or at the start or end
# of any Turn or Round." Quetz's Piedra Del Sol carries the identical block
# WITH a 2◈ lockout; Drake's sheet states none, so there is none.
deactivation: { byOwner: true, window: any }
# "If an enemy Unit attempts to board the Golden Hind, it rolls a ten-sided die.
# The enemy unit successfully boards the Golden Hind if a 10 is rolled."
#
# Spec R7. Flat -- no rank relief, no Levitating branch. The Hanging Gardens'
# shared rule has both, and lending them here would let an AGI-A LUC-A Servant
# aboard on a 6 instead of a 10.
#
# `byRelation: enemy` is the sheet's next sentence: "Other allied Units can
# board and unboard the Golden Hind by Moving onto it normally."
boarding: { die: 10, target: 10, byRelation: enemy }
# "Full damage to the ship, 50% to units aboard, Masters aboard take nothing."
# Three target sets from one placement -- the only platform in the set where
# the vehicle and its passengers take different fractions.
crossLevel:
  occupantTargeting: forbidden
  requiresBoarding: true
  aoePassengerFactor: 0.5
  aoeMastersImmune: true
  outboundTargeting: rangedOnly
  forbidDirectlyBelow: true
