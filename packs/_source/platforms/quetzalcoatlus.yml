# Quetzalcoatl, char_orig_sheets/Copia de Quetzalcoatl.md
# Platform model: docs/27-platforms-and-levels.md
#
# Ch. 27 built the per-role AoE axis specifically because this mount is *"the
# first platform in the set where the mount itself takes full AoE damage while
# its riders are partially shielded"*. It has been waiting for her: the three
# tiers her sheet states fall straight out of `aoePassengerFactor` unchanged --
# the function returns 1 when the unit IS the platform, 0 for a Master when
# `aoeMastersImmune`, and 0.5 for everyone else.
schema: 1
id: quetzalcoatlus
name: "Quetzalcoatlus"
type: platform
attributes: [giant, beast]
baseHealth: 1000
agility: 16
# "Luck: Shared with Quetz's" -- ONE POOL with hers (ruled, 2026-10-01), not a
# number copied at the cast: the board reads her CURRENT Luck as the mount's,
# and a Luck either of them spends comes out of hers. Never stored on the mount.
inherit:
  luck: { from: summoner }
mov: 7
range: { panels: 2, targets: 1 }
baseAttack: { str: 150, mag: 0 }
normalAttack: { mode: fixed, component: str }
# 2x2 panels, ruled by the user (2026-10-01): the sheet prints no size, and the
# mount is neither a fortress nor a single panel. The schema's default would
# have made it 3x3 silently, so the size is stated.
footprint: { w: 2, h: 2 }
# Quetz and her Master, and nobody else.
capacity: 2
level: 1
# "…otherwise her Master can get on the Quetzalcoatlus at any time." Ruled by
# the user (2026-10-01): freely, with no roll -- and no enemy takes the seat.
# The two seats are roles, because the document is authored long before it has
# an owner; any other Unit, ally or enemy, is refused (`seatVerdict`).
boarding: { seats: [owner, ownerMaster] }
# "The Quetzalcoatlus ignores obstacles while Moving, and can Move onto occupied
# panels (place the Quetzalcoatlus on top of anything occupying said panels)."
#
# `sharesPanel`, NOT `movesOntoOccupiedPanels`: the second is Bašmu's and means
# *"all Units occupying said panels will be knocked back"*. This one co-locates
# and displaces nobody, which is what "place it on top of" says.
sharesPanel: true
# "While Quetz is Riding the Quetzalcoatlus, Quetz's Move and Normal Attack is
# replaced with Quetzalcoatlus'." Her Master rides as cargo -- Passenger Seat
# lets him come along, it does not hand him the reins -- which is `roles`.
replacesRiderAction: { roles: [owner], move: true, normalAttack: true }
# "After every 1◈ Turns, Quetz's Master's Health is reduced by 25 at the end of
# the Turn if this NP is Active... If her Master's Health is 25 or less, this NP
# is forcefully deactivated."
#
# The same block Jack's Mist carries at 15, swept by the same `runUpkeep`.
# `endWhenUnaffordable` is the "or less" half: the mount closes INSTEAD of
# charging, rather than charging him to death.
upkeep:
  every: "1◈"
  cost: { kind: health, amount: 25, payer: ownerMaster }
  endWhenUnaffordable: true
# "This NP can be deactivated during Quetz's Turn or at the start or end of any
# Round or Turn, BUT CANNOT BE DEACTIVATED FOR 2◈ TURNS after it was activated."
#
# Piedra Del Sol carries the identical block WITHOUT the lockout, which is
# exactly the difference between the two sheets' final paragraphs.
deactivation: { byOwner: true, window: any, lockout: "2◈" }
crossLevel:
  # "Quetz or her Master cannot be targeted for an Attack while they are Riding
  # the Quetzalcoatlus."
  occupantTargeting: forbidden
  # ...for an ATTACK, and from an enemy. The sheet bars nothing else, so an
  # ally's buff or heal, and an enemy's Skill that is not an Attack, may still
  # target them (#138). The Hanging Gardens and the Golden Hind say Skills too.
  protectedFrom: enemies
  protectedAgainst: attacks
  # "If they are hit with an AoE Attack, the Quetzalcoatlus receives full damage,
  # Quetz receives 50% Total Damage while her Master receives no damage and
  # effects." Three tiers, TWO authored values -- the third is the function's
  # own `unit.id === platform.id` branch, which is why Ch. 27 needed this mount
  # to discover the axis.
  aoePassengerFactor: 0.5
  aoeMastersImmune: true
  # Nothing stops her Spells reaching the ground, and they are her whole reason
  # to be up there.
  outboundTargeting: free
  forbidDirectlyBelow: false
notes: |
  The fifth platform, and the first a passenger drives rather than rides.

  Its three AoE tiers are the reason Ch. 27 has a per-role protection model instead of a
  single number: the Hanging Gardens and the Golden Hind both shelter everyone aboard, and this
  one shelters its riders while taking the blast in full.
