# docs/33-command-spells.md — cost 2 and cost 3
# The round gate is explicitly NOT overridable, so it is absent from this list.
schema: 1
id: cs-noble-phantasm-max
name: "Noble Phantasm Max"
type: commandSpell
cost: 2
description: +100% Total Damage of the Servant's Noble Phantasm.
requirements:
  - { kind: servantInZon }
  # *"Increases the Total Damage of the Servant's Noble Phantasm"*: offered on
  # an NP's card only. It had no such gate and was offered on every attack
  # (#241, found beside Heaven's Feel, which reads the same kind).
  - { kind: attackIsNP }
# Offered once, on the declaration window's card, before any Combat Process
# exists: one spend boosts every target of the attack (ruled 2026-10-17, #241).
timing: { window: beforeAttack }
effect:
  - kind: modifyDamage
    # An increase, which ADDS to another increase of the same Total Damage
    # (#241 reading 11): +100% beside Heaven's Feel's +200% is x4.
    percent: 100
    side: attacker
