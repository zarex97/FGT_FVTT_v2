# docs/33-command-spells.md — cost 1
#
# The catalogue is explicitly OPEN: "if you can think of any other use for
# Command Spells, feel free to mention it and use it if the GM/majority of
# players approve." So this is the reference set, not a closed enum.
# "Cannot be used during a Damage Step if the damage would defeat the Servant."
# 1 for a High Rank Master, 2 for a Low Rank one. `cost` is the fallback for
# anything that reads the flat field.
schema: 1
id: cs-damage-up
name: "Damage Up"
type: commandSpell
cost: 1
description: +100% Total Damage of the Servant's Normal Attack, Attack Skill or Damage Spell.
requirements:
  - { kind: servantInZon }
  - { kind: attackIsNotNP }
# Offered once, on the declaration window's card, before any Combat Process
# exists: one spend boosts every target of the attack (ruled 2026-10-17, #241).
timing: { window: beforeAttack }
effect:
  - kind: modifyDamage
    # An increase, which ADDS to another increase of the same Total Damage
    # (#241 reading 11): +100% beside Heaven's Feel's +200% is x4.
    percent: 100
    side: attacker
