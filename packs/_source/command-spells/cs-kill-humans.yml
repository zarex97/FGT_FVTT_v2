# docs/33-command-spells.md — cost 1
#
# > "Kill Humans: After this Command is used, a Servant with the 'Good' Alignment
# > will kill Civilians. However, if said Servant ever becomes an Unbound
# > Servant, the Servant will abandon the Master and become a Free Servant. In
# > this case, the Servant will refuse to make a new Contract with its old
# > Master."
#
# Spent in the Master's own Turn, and it lasts: *"After this Command is used"*.
# It was authored at a `validationFailure` window nothing ever offered, with an
# `overridesValidation` and a `permanentConsequence` nothing ever read, so it
# could not be spent and its Contract half did nothing (#241). It now lays the
# `killHumans` mark, which the three rules read (`effects/kill-humans.yml`).
schema: 1
id: cs-kill-humans
name: "Kill Humans"
type: commandSpell
cost: 1
description: |
  A Good-aligned Servant will kill Civilians.

  PERMANENT CONSEQUENCE: if the Servant ever becomes Unbound it abandons this Master and
  refuses to re-contract.
requirements:
  - { kind: notMarked, effect: killHumans }
timing: { window: ownTurn }
effect:
  - { kind: applyEffect, effect: killHumans, target: contractedServant }
