# docs/Master Essences.md, Rank C Master
#
# > "Crystal: Reduces Servant's NP Cooldown by 2◈ Turns. 1 use only, Player decides when it's used."
#
# One use, from the Master's bar, while an NP is cooling; it cuts every NP's
# clock (#197 reading 6) and is refused before the NP gate opens (#241
# reading 12). A Command Spell's vocabulary, read by the same offer and spend.
schema: 1
id: me-crystal
name: "Crystal"
type: masterEssence
rank: C
description: |
  Reduces Servant's NP Cooldown by 2◈ Turns. 1 use only, Player decides when it's used.
maxUses: 1
timing: { window: ownTurn }
requirements:
  - { kind: npGateOpen }
  - { kind: npCooling }
effect:
  - { kind: cooldownDelta, scope: theNP, delta: "-2◈", target: contractedServant }
