notes: |
  Authored from the original tabletop sheet as the first of the D1 pass.

  `Chaos Labyrinthos` is authored as of C4. It is a point in Ch. 43's six-axis bounded-field
  model rather than a special case: `fixedArea` geometry with a Greece size override, free entry
  and a roll to leave, total isolation both ways, MOV +4 for Asterios and −2 for enemies inside,
  paid extension at 200 of his own Health, and an owner-defeat vulnerability. The escape ladder —
  20% base, +5% per failure, border contact and remaining MOV required, and the veteran clause
  that lets an escapee lead adjacent allies out — is the reference implementation of §43.4.

  ONE CLAUSE REMAINS: Mad Enhancement's two-way 2◈ lockout (it cannot be deactivated until 2◈
  after activating, and cannot be reactivated until 2◈ after deactivating). The class-skill
  template has no lockout field, and this is a property of the SKILL rather than of Asterios —
  Penthesilea's Mad Enhancement EX carries the same clause. It is recorded in Ch. 45 rather than
  faked here.
