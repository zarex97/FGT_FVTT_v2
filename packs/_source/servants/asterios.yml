notes: |
  Authored from the original tabletop sheet as the first of the D1 pass.

  NOT YET AUTHORED — `Chaos Labyrinthos: Eternally Unchanging Labyrinth` (Rank EX, non-damaging).
  It is a 9x9 bounded field (11x11 in Greece) with membership, an escape check whose chance
  rises 5% per failure, per-unit escape history, leading allied units out, and a hard rule that
  units inside and outside cannot affect one another. That is Ch. 43 Bounded Fields almost in
  its entirety, which is C4 and unimplemented — so the NP is deliberately absent rather than
  half-present. Adding a stub that applied the Atk Dwn and Def Dwn without the containment
  would be worse than nothing: it would look like the Labyrinth worked.

  Mad Enhancement's two-way 2◈ lockout (cannot deactivate until 2◈ after activating, and cannot
  reactivate until 2◈ after deactivating) is not modelled either; the class-skill template has
  no lockout field. Found by this conversion, recorded in Ch. 45 D1.
