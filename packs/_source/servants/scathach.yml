normalAttack: { mode: fixed, component: str }
sustainability: "2◈"

# ─── Resources (§6.10) ─────────────────────────────────────────────────
# PRS Tokens: max 2, +2 per Primordial Rune, 1 spent to waive a Rune Spell's
# cooldown. The FIRST resource pool in the system -- §6.10 designed the general
