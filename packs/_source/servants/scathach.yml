# packs/_source/servants/scathach.yml
# Conversion source: char_orig_sheets/Copia de Scáthach.md
schema: 1
id: scathach
name: Scáthach
type: servant

# ─── Identity ──────────────────────────────────────────────────────────
trueName: Scáthach
servantClasses: [lancer]
classContainer: lancer
alignment: { order: neutral, morality: good }
region: [ireland]
attributes: [female, servant, star, humanoid]

# ─── Parameters and stats ──────────────────────────────────────────────
parameters: { str: B, end: A, agi: A, mag: C, luc: D }
baseHealth: 1500
mov: 7
range: { panels: 2, targets: 1 }
baseAttack: { str: 125, mag: 150 }
# A Lancer attacks with STR. Her Base Attack (MAG) is higher and is used by
