# packs/_source/servants/emiya.yml
# Conversion source: char_orig_sheets/Copia de EMIYA.md
schema: 1
id: emiya
name: EMIYA
type: servant

# ─── Identity ──────────────────────────────────────────────────────────
trueName: EMIYA
servantClasses: [archer]
classContainer: archer
alignment: { order: neutral, morality: neutral }
region: [japan]
attributes: [male, servant, man, humanoid, antiHero]

# ─── Parameters and stats ──────────────────────────────────────────────
parameters: { str: D, end: C, agi: C, mag: B, luc: E }
baseHealth: 1000
mov: 4
range: { panels: 4, targets: 1 }
baseAttack: { str: 75, mag: 175 }
# THE clause that made him worth building, and the reason `rangeBanded` stopped
# being a mode nothing implemented:
#
#   "At a Range of 1 or 2, EMIYA's Normal Attacks use Base Attack (STR). At a
#    Range of 3 or higher, EMIYA's Normal Attacks use Base Attack (STR) and 20%
#    of his Base Attack (MAG) combined (i.e. 75+35=110); not affected by Magic
#    Resistance."
#
# Three things move together at the edge. The sources are the arithmetic; the
# `component` is what the attack COUNTS AS, which decides Magic Resistance's
# Instakill exemption and every `attack:component:` predicate; and
# `ignoresMagicResistance` is what stops a Rank C Magic Resistance negating an
# arrow because a fifth of it is prana.
normalAttack:
  mode: rangeBanded
  component: str
  bands:
    - from: 3
      component: str
      ignoresMagicResistance: true
      sources:
        - { component: str, factor: 1 }
        - { component: mag, factor: 0.2 }
sustainability: "7◈"

# ─── Resources (§6.10) ─────────────────────────────────────────────────
# Aria, the second Resource pool in the system after Scáthach's PRS Tokens, and
# the first that is spent all at once: Unlimited Blade Works "can only be used
# by consuming 6 Aria" and the pool holds exactly 6. Gained one per Combat
# Phase, which is why `combatPhaseEnd` had to become an event that fires.
resources:
  aria: { value: 0, max: 6 }

# ─── Abilities ─────────────────────────────────────────────────────────
abilities:
  - { ref: class-independent-action, rank: B }
  - { ref: class-magic-resistance, rank: D }
  - { ref: emiya-clairvoyance }
  - { ref: emiya-hawkeye }
  - { ref: emiya-eye-of-the-mind-true }
  - { ref: emiya-eye-of-the-mind-true-ex }
  - { ref: emiya-magecraft }
  - { ref: emiya-projection-magic }
  - { ref: emiya-reinforcement }
  - { ref: emiya-tracing }
  - { ref: emiya-trace-on }
  - { ref: emiya-kanshou-and-bakuya }
  - { ref: emiya-overedge }
  - { ref: emiya-caladbolg }
  - { ref: emiya-hrunting }
  - { ref: emiya-rho-aias }
  - { ref: emiya-unlimited-blade-works }

notes: |
  The seventh Servant, the first Archer, and the one whose sheet is written almost entirely in
  terms of **distance**. Nothing in the engine emitted one.

  `attack:range:gte:N` and `attack:range:lte:N` are new roll options, and half his kit turns on
  them: the Normal Attack changes what it is made of at 3, *Clairvoyance* and *Hawkeye* switch
  on at 3, *Kanshou & Bakuya* applies at 2 or lower and *Overedge* stretches it to 3, and
  *Hrunting* refuses at 1. `normalAttack.mode: rangeBanded` had been one of three declared
  choices in the actor schema since it was written with nothing implementing it — a Servant
  authored with it attacked with its flat `component` at every distance, silently.

  He is also the first Servant to need a **whole-match** budget rather than a cooldown.
  *Trace, On* charges 5% of his Health "if this is not the first time EMIYA has used this Skill
  in this game" and *Rho Aias* restores half its Health "every time it is used after its first
  usage", so `timesUsed` is recorded per ability — which is the same field Heracles's God Hand
  needs for "can only be used 11 times".

  **Activated Circuits and Blazing Circuits** are the interesting authoring problem. They are
  not buffs, cannot both be held, cannot be removed except by their own clause, and are chosen
  by the player at the moment *Trace, On* resolves. Two effects and a `blocks` pair express all
  of that; the choice is the same `ChoiceDialog` Scáthach's Primordial Rune wildcard opens.

  Two of his Noble Phantasms disagree about the same Round rather than the same Turn —
  "Caladbolg II cannot be used on the same Round as Hrunting and vice versa" — which a
  `sameTurnExclusive` cannot say, because he acts three times in a Round.
