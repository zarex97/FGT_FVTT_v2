notes: |
  A Caster of Spells and tokens. Witchcraft's Mantra Tokens waive four Damage Spells' Cooldowns
  as Scáthach's PRS Tokens waive her Rune Spells, and the four lock each other while any cools.
  Yata no Kagami opens the Amaterasu Area, a field she cannot leave, and switches on her
  Divinity; Dainisshō spends it.
