notes: |
  Second Servant of the D1 pass. Her Charisma is the archetypal aura and the reason `relations`
  is a list: "all damage dealt by OTHER allied Units within a 2 panel area" means allies WITHOUT
  self, so `self` is dropped from the default `[ally, self]` and she gains nothing from her own
  Charisma. Ch. 11 §11.6 cites exactly this case; A5 now implements it.

  She is now fully authored. Four engine additions were needed, each driven by one of her
  clauses rather than invented up front:

  - **`Compulsion`** (`rules/compulsion.mjs`), for *Hatred of Achilles*. Positional like an aura,
    because it lifts the instant the Greek Male leaves. The targeting resolver reads it and
    narrows her legal targets -- which is the reader §45.4 recorded as missing for the whole
    targeting-executor family.
  - **`skill:`, `skillActive:` and `region:` roll options.** `tables.mjs` had predicated on
    `target:skill:divinity` since the tables were transcribed and nothing ever emitted a `skill:`
    option. `skillActive` is what lets *Charisma* be "negated when Mad Enhancement is activated",
    and `region:` is what lets *Howl of the War God* name a Greek Male.
  - **Self-options in `contributionsOf`**, which passed an EMPTY set, so every `self:` predicate
    was unsatisfiable.
  - **Rolled modifiers**, for *Goddess of War*: a magnitude rolled per damage event rather than
    fixed before the attack. The dice stay with the caller, like every other roll here.

  One clause remains: Goddess of War's *"Divinity Rank is increased from B to A"*. `RankShift`
  moves a **parameter**, and this moves another ability's rank -- a different operation, and one
  no other Servant in the reference set needs yet. Her Divinity is authored at B.
