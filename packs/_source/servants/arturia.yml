# packs/_source/servants/arturia.yml
# Conversion source: char_orig_sheets/Copia de Arturia.md
# Audit: #230 (docs/superpowers/specs/2026-10-16-arturia-clauses.md) · data sheet: docs/D-servant-data-sheets.md §D.33d
#
# Built to be reused: every Ability below is the generic piece another sheet
# already uses, or an extension of it the next sheet with the same words gets
# for free (docs/superpowers/plans/2026-10-16-arturia-build.md).
schema: 1
id: arturia
name: Arturia
type: servant

trueName: Arturia Pendragon
servantClasses: [saber]
classContainer: saber
alignment: { order: lawful, morality: good }
# "Britain, England". The region graph knows England (`rules/environment.mjs`);
# Britain is the island it stands on, not a second node.
region: [england]
# "Female, Servant, [Earth], Saberface, Dragon, King, Humanoid, Round Table".
# Round Table is read by Knight of Utopia's second Atk Up; Dragon by any
# Anti-Dragon clause that reaches her.
attributes: [female, servant, earth, saberface, dragon, king, humanoid, roundTable]

parameters: { str: B, end: B, agi: B, mag: A, luc: "A+" }
baseHealth: 1250
mov: 5
range: { panels: 1, targets: 1 }
# The sheet prints BA(STR) 175. The STR table gives 125 at B, and the table wins
# (§46.6; ruled again 2026-10-16, reading 1), so Mana Burst's combined Base
# Attack is 325, not the printed 375.
baseAttack: { str: 125, mag: 200 }
# "N.Atk Type: STR, Melee" in `by-class/Saber/Arturia.md` (#281).
normalAttack: { mode: fixed, component: str, delivery: melee }
sustainability: "2◈"

# Avalon: "When Arturia is summoned, roll an eight-sided die. If an 8 is rolled,
# she is summoned with the [Avalon] Item." Without it she has neither of its
# methods (reading 14).
summonItems:
  - { item: avalon, roll: "1d8", on: [8], label: "Avalon (on an 8)" }

abilities:
  - { ref: class-magic-resistance, rank: A }
  # Passive 3, the Anti-Dragon threshold (reading 21).
  - { ref: class-magic-resistance-weakness, tag: antiDragon, rank: C, percent: 25 }
  - { ref: class-riding-unlocks, rank: B, cooldown: "2◈", mov: 4 }
  - { ref: arturia-vivians-blessing }
  - { ref: arturia-charisma }
  - { ref: arturia-knight-of-utopia }
  - { ref: arturia-instinct }
  - { ref: arturia-radiant-road }
  - { ref: arturia-mana-burst }
  - { ref: arturia-dragons-reactor-core }
  - { ref: arturia-invisible-air }
  - { ref: arturia-strike-air }
  - { ref: arturia-excalibur }
  - { ref: arturia-avalon }
  - { ref: arturia-avalon-place }
  - { ref: arturia-avalon-retrieve }
