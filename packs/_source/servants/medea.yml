notes: |
  The fifth Servant, and the densest sheet converted so far: thirteen abilities, seven of them
  Spells, and a Noble Phantasm that rewrites the relationship graph.

  She is also the first Caster, which matters more than it sounds. Her Detect is 5 panels in her
  Home Base and 3 outside it (Ch. 08), her normal attack uses Base Attack (MAG), and she is a
  legal *contractor* -- §16.2 lets a Caster contract a Servant, which nothing on the board could
  do before her.

  Rule Breaker is the first content to use the contract intents added for §16.2. It is also the
  only ability in the reference set that takes Command Spells FROM a Master: the sheet is
  explicit that the Servant's Contract and three Command Spells are given to Medea, which is
  precisely `markContract` plus `grantCommandSpells` and is why those two land in one batch.

  Its `evadeFailed` condition is the subtle half. A successful Evade keeps the contract, so the
  clause cannot be a phase that runs unconditionally after damage -- it has to read the ladder's
  outcome.
