# Medusa's Riding A+ Active: "Additionally, 'Riding Attack', and 'Passenger
# Seat' can be used on this Turn."
#
# What it does is satisfy the `self:effect:ridingActive` predicate on Riding's
# two granted abilities, which is how a passive becomes conditional on an Active
# without a new mechanism -- AND carry the Active's MOV Up.
#
# The MOV lives here rather than in Riding's own `activeRules` because Medusa's
# Riding is a USED ability, not a mode: it has phases, so `classifyAbility`
# calls it `active`, and `contributionsOf` reads `activeRules` only while
# `system.active` is set -- which nothing sets for an ability that is used
# rather than toggled. Authored there, the +5 was collected by nothing and
# using Riding raised her MOV by zero. An effect is collected with
# `active: true` because an effect that is present is in force, so the lasting
# half of a used ability belongs on what it applies. `class-riding.yml` and Pale
# Rider's keep theirs in `activeRules` correctly: those two ARE modes.
#
# `unremovable`, for the same reason the MOV Up is not a buff: the sheet says
# the Active's grant "cannot be removed by buff removal effects, or prevented
# by an effect that prevents buffs from being applied."
schema: 1
id: ridingActive
name: "Riding (Active)"
description: "Riding Attack and Passenger Seat may be used this Turn."
polarity: buff
volatility: nonVolatile
valence: neither
stacking: noneRefresh
baseChance: 100
unremovable: true
rules:
  # "Increases MOV by N panels for this Turn." `@magnitude` rather than a
  # literal, because the number is the SKILL's rank and an effect is collected
  # with `rank: null` -- so a `table:` lookup here has no grade to read. That
  # reasoning is Pale Rider's and is unchanged; what changed is the literal.
  #
  # It was `5` until Drake arrived at Riding B, whose `ridingMov` is 4. Five is
  # Riding A's value -- Medusa's -- so reusing the effect unchanged would have
  # given Drake Medusa's rank silently, and a MOV one too high looks exactly
  # like a MOV.
  #
  # Each Riding variant now passes its own: Medusa 5, Drake 4.
  - key: MovDelta
    value: "@magnitude"
    # Not a buff: "cannot be removed by buff removal effects, or prevented by an
    # effect that prevents buffs from being applied." The effect's own
    # `unremovable` covers the instance; this covers the modifier it contributes.
    isBuff: false
