# The Dioscuri, char_orig_sheets/Copia de Dioscuri.md
#
# Half of a COMPLEMENTARY PAIR: this one fires on a Normal Attack that does NOT
# Crit, `castor-buff` fires on one that does, and both twins carry both. Every
# Normal Attack therefore triggers exactly one of them -- a tidy piece of design
# in the source that needs no new mechanism at all.
#
# Named for Pollux and carried by BOTH twins: the sheet names the buffs after
# the twins rather than after their bearers.
schema: 1
id: polluxBuff
name: "Pollux"
description: |
  When the affected Unit performs a Normal Attack that does not Crit, applies @effect[sCritUp]{S.Crit Up} for
  ⅓◈ Turns to all allied Units within a 2 panel area of itself (and its linked partner wherever
  it stands), Crit Chance is increased by 10%.
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: noneRefresh
baseChance: 100
rules:
  - key: OnEvent
    event: damageStepEnd
    automatic: true
    predicate: ["attack:kind:normal", { not: "attack:crit" }]
    then:
      # WHO, on the action: `target: nearby` is what the dispatcher reads. A
      # handler-level `targeting` block said the same thing to nobody, so only
      # the bearer ever got S.Crit Up (#103).
      #
      # S.Crit Up is an aura its holder carries (#132). This one is the
      # bearer's, and reaches its linked partner wherever it stands: the
      # *"(and Pollux if she is out of the Skill's Range)"* clause.
      - key: ApplyEffect
        target: self
        effect: { id: sCritUpPollux }
        duration: "⅓◈"
        magnitude: 10
