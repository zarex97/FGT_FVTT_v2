# EMIYA's Hawkeye, char_orig_sheets/Copia de EMIYA.md
schema: 1
id: critDmUpHawkeye
name: "Crit DmUp (Hawkeye)"
description: "Crit Damage is increased by X% at a Range of 3 or higher."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: magnitudeStacks
baseChance: 100
rules:
  # A `CritModifier` with `aspect: damage`, like plain `critDmUp`: crit damage
  # scales the Attack+ roll at stage 2 and never touches the Attack- branch, so
  # it is not a `DamageModifier`.
  - key: CritModifier
    aspect: damage
    modifierKey: critDmUp
    value: "@magnitude"
    predicate: ["attack:range:gte:3"]
