# Appendix A §A.4
#
# "As Crit Up, but application cannot be prevented and it is Unremovable."
# Ruled 2026-10-06 (#132): an AURA held by its caster. The caster holds this
# effect, and its Crit Chance reaches every allied Unit within 2 panels of him,
# entering and leaving as they move (`rules/auras.mjs`). The allies hold
# nothing, so nothing on them can be removed: "cannot be prevented" means the
# bonus is stripped only by removing this effect from its holder, as an aura is
# ended at its source.
#
# A Unit with No Buff or a buff Immunity receives nothing from it, and No Buff
# on the holder stops nothing: it is the receiving that a buff gate refuses.
# So the holder's own copy passes the gate (`bypassesImmunity`), and the aura
# checks each recipient (`collectAuras`, `buff`).
#
# Chance 100, an ordinary buff's: the 500 it carried read "cannot be prevented"
# as "past every resistance", which the ruling does not.
schema: 1
id: sCritUp
name: "S.Crit Up"
description: "Crit Chance of all allied Units within a 2 panel area of this Unit is increased by X%. Removed only from this Unit, which ends it for all of them."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: magnitudeStacks
baseChance: 100
bypassesImmunity: true
rules:
  - key: Aura
    radius: 2
    relations: [ally, self]
    stacking: magnitudeStacks
    elements:
      - { key: CritModifier, aspect: chance, value: "@magnitude" }
