# Appendix A §A.10
schema: 1
id: npSeal
name: "NP Seal"
description: "Cannot use Noble Phantasms. Does not affect passive NPs unless stated, and does not stop NPs that fire on a timer."
polarity: debuff
volatility: nonVolatile
valence: offensive
stacking: noneRefresh
baseChance: 100
# NO rule elements. What actually refuses a Noble Phantasm is the prevention
# table in `rules/budget.mjs` (`npSeal: ["np"]`), which is consulted at
# declaration -- before targeting, before any cost is paid.
#
# There WAS a `Suppress` element here, predicated on `self:ability:isNP`.
# Nothing emits that option and nothing reads a suppression scoped `abilities`,
# so it was inert twice over; keeping it implied a second enforcement path that
# does not exist, which is worse than having none.
