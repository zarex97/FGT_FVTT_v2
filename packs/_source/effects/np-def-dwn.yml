schema: 1
id: npDefDwn
name: "NP Def Dwn"
description: "All NP damage received is increased by X%."
polarity: debuff
volatility: nonVolatile
valence: defensive
stacking: magnitudeStacks
baseChance: 100
rules:
  - key: DamageModifier
    modifierKey: defDwn
    direction: taken
    value: "@magnitude"
    predicate: ["attack:kind:np"]
