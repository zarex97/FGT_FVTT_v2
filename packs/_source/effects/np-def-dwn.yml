# NP Def Dwn: Gray's Rhongomyniad (#362 reading 8).
#
# > "Then, all affected enemy Units are inflicted with ~~Def Dwn (B)~~ NP Def
# > Dwn for 1◈ Turns, all NP damage received is increased by ~~20%; if NP,~~
# > 30%"
#
# The struck text is deleted: an NP's damage taken rises by the magnitude, and
