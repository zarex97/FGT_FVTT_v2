# EMIYA's Trace, On -- char_orig_sheets/Copia de EMIYA.md
# The aggressive half of the pair. See `activated-circuits.yml` for why the
# polarity is `status`, the exclusion is declared twice, and the second clause is
# a document of its own (`bcNextNp`, then `bcOverdrive`).
schema: 1
id: blazingCircuits
name: "Blazing Circuits (BC)"
description: |
  While Unlimited Blade Works is Active, Normal Attack damage dealt is increased by 50. The
  next time EMIYA uses an NP that deals damage, all damage dealt by EMIYA is increased by 20%
  including NP for the rest of the Round, from the next Attack on (see @effect[bcNextNp]{the
  second clause}).
polarity: status
volatility: nonVolatile
valence: neutral
stacking: noneRefresh
baseChance: 500
unremovable: true
# `replaces`, not `blocks`. The sheet says both things at once -- "EMIYA
# cannot have both the AC and BC effects at the same time" AND "you can
# choose to swap from AC to BC or vice-versa" -- and `blocks` can only say
# the first, by REFUSING the swap. Declared on both sides, so whichever is
# applied wins and the swap is the same write as the first pick. The other
# circuit's pieces go with it: they are part of it.
replaces: [activatedCircuits, acNextNp, acOverdrive]
rules:
  # Clause 1. A FLAT 50 on Normal Attacks inside the Marble -- flat, like Dmg
  # Boost, because the sheet prints no per cent sign. Damage exists only on a
  # hit, so "needs a hit" (reading 10) is the clause's own shape: a miss has no
  # damage to add 50 to. The field is named by its CONTENT id; the slug it was
  # written with is no field (#208).
  - key: FlatDamage
    modifierKey: dmgBoost
    value: 50
    predicate: ["attack:kind:normal", "self:inField:emiya-unlimited-blade-works"]
