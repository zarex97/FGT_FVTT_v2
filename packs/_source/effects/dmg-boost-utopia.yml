# Knight of Utopia's third effect, on Arturia.
#
# > "Applies Dmg Boost (Utopia) for 1◈ Turns to herself- After Arturia performs
# > 3 Attacks, her next Normal Attack deals 200% extra damage, then this buff is
# > removed." (#230)
#
# Ruled 2026-10-16: any Attack she performs counts, hit or miss, NPs included
# (reading 5); the 200% is added like an Atk Up (reading 6); a Mana Burst and a
# Riding Attack are Normal Attacks for it, and on a ride it reaches every Unit she
# strikes, then ends (reading 25).
#
# The count is held as `utopiaCount` instances, one per Attack, read through
# `self:effectStacks:utopiaCount:gte:3`. The Attack that fires it is a Normal
# Attack made with 3 already counted: the buff is removed at that Attack's end
# (`attackPerformed`), and the count with it. Every other Attack adds one.
schema: 1
id: dmgBoostUtopia
name: "Dmg Boost (Utopia)"
description: "After this Unit performs 3 Attacks, its next Normal Attack deals 200% extra damage; then this buff is removed."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: noneRefresh
baseChance: 100
onRemove:
  - { key: RemoveEffect, effect: utopiaCount }
rules:
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    value: 200
    npValue: 200
    predicate: ["attack:kind:normal", "self:effectStacks:utopiaCount:gte:3"]
  - key: OnEvent
    event: attackPerformed
    automatic: true
    targetPredicate: ["attack:kind:normal", "self:effectStacks:utopiaCount:gte:3"]
    then:
      - { key: RemoveEffect, effect: dmgBoostUtopia }
  - key: OnEvent
    event: attackPerformed
    automatic: true
    targetPredicate:
      - { or: ["not:attack:kind:normal", "not:self:effectStacks:utopiaCount:gte:3"] }
    then:
      - { key: ApplyEffect, effect: { id: utopiaCount } }
