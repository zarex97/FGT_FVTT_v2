# Francis Drake, char_orig_sheets/Copia de Francis Drake.md
#
# "Applies the 'Uncharted' buff for 1◈ Turns to Drake, her Detect is increased
# by 3 panels."
#
# `detect` is already in `rules/derived.mjs`'s `MODIFIABLE_PATHS`, so
# `restoreModifiable` puts it back before each preparation and the +3 cannot
# accumulate across prepares -- the drift Mad Enhancement's MOV +2 once had,
# where Heracles went 6 -> 8 -> 10 -> 12 across four preparations.
schema: 1
id: uncharted
name: "Uncharted"
description: "Detect is increased by 3 panels."
polarity: buff
volatility: nonVolatile
valence: neutral
stacking: noneRefresh
baseChance: 100
rules:
  # `value`, NOT `add`. `StatDelta`'s `add` is the ATTRIBUTE-tag list -- the
  # one Divinity uses to grant `divine` -- and a number there is iterated as a
  # set. Found live: it threw out of `currentBoard()` and took the whole board
  # snapshot with it. The authoring vocabulary said `add` was a number, which
  # is what invited the mistake; both are fixed.
  - key: StatDelta
    stat: detect
    value: 3
