# Karl de Große's Holy King, the dealt half (#351): *"Applies Dmg Up (Holy) for 1◈
# Turns, all damage dealt to Units with the 'Demonic' Attribute or Units with
# the 'Divine' Attribute but without the 'Christian' Attribute is further
# increased by 50%; if NP, 25%."* Demonic is its three kin (reading 10);
# Christian is the roster's Attribute (readings 9, 32 to 34).
schema: 1
id: dmgUpHoly
name: "Dmg Up (Holy)"
description: "Damage dealt to Demonic Units, or Divine Units without the Christian Attribute, is increased by X%."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: magnitudeStacks
baseChance: 100
rules:
  - key: DamageModifier
    modifierKey: dmgUp
    direction: dealt
    value: "@magnitude"
    npValue: "@npMagnitude"
    predicate:
      - or:
          - "target:attribute:demonic"
          - "target:attribute:demonicBeast"
          - "target:attribute:demonicOni"
          - { and: ["target:attribute:divine", "not:target:attribute:christian"] }
