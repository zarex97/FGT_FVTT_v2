# Appendix A §A.12
# "Lasts 2 fixed by default. BA(STR & MAG) -30. 50 Burn damage at the end of every Round."
schema: 1
id: burn
name: "Burn"
description: "Reduces both Base Attacks by 30 and deals 50 Burn damage at the end of every Round."
polarity: debuff
volatility: volatile
valence: offensive
stacking: noneNoRefresh
baseChance: 100
defaultDuration: "2◈"
# Read by `engine/scheduler.mjs#periodicOf`, the only source of the tick (#105).
# Flame Heal turns it into healing.
periodic: { when: roundEnd, amount: 50, healConversion: flamHeal, bypassModifiers: true }
rules:
  - key: StatDelta
    stat: baseAttack.str
    value: -30
  - key: StatDelta
    stat: baseAttack.mag
    value: -30
