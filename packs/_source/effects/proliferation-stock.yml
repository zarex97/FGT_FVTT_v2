# Kingprotea, char_orig_sheets/Copia de Kingprotea.md · docs/45-case-studies.md
#
# What a stock is worth -- Max Health, size, Range, MOV -- lives HERE, on the
# stock: a Skill Seal on Huge Scale does not switch it off, and only removing a
# stock removes its effect (#198 reading 8). Huge Scale's Passives 2 and 3 are
# that Skill's own clauses and stay on it.
#
# `rulesOncePerBearer` is what lets a `perStack` element live on the thing it
# counts. An effect's rules are otherwise collected once per INSTANCE, and ten
# stocks would pay a hundredfold; collected once, they scale by the count.
#
# `magnitudeStacks` is what makes each application its own document, which is
# the sheet's *"each Proliferation stock counts as a separate buff"* -- and what
# lets `Infantile Regression` remove them and `stacksHeld` count them.
#
# No duration: *"Proliferation stocks are not lost when Endless Proliferation
# ends."* They go when something takes them.
schema: 1
id: proliferationStock
name: "Proliferation"
description: |
  A Proliferation stock. Each is worth +20% of Kingprotea's original Max Health, −10% NP damage
  taken (to a maximum of 80%) and +5% buff-removal resistance; every third also grows her by one
  panel, which is +1 Range and −1 MOV.
polarity: buff
volatility: nonVolatile
valence: defensive
stacking: magnitudeStacks
# "Kingprotea can only have a maximum of 10 Proliferation stocks." A `noop` at
# the ceiling rather than a refusal: the eleventh Turn of Endless Proliferation
# is not an error, it simply has nothing left to give.
maxStacks: 10
baseChance: 100
rulesOncePerBearer: true
rules:
  # "Max and current Health is increased by 20% of Kingprotea's ORIGINAL Max
  # Health." The maximum is this, derived from the stock count on every
  # preparation; the CURRENT is paid once by the handler that grants the stock
  # (`effects/endless-proliferation.yml`), because a derived `alsoCurrent` would
  # refill her every frame. A lost stock drops the maximum, and the current only
  # to fit under it (#198 reading 5).
  #
  # `@self.baseHealth` and not `health.max`: her maximum has already grown by
  # the time the second stock lands.
  - key: MaxDelta
    stat: health
    value: "0.2 * @self.baseHealth"
    perStack: { effect: proliferationStock }

  # "For every 3 Proliferation stocks, Kingprotea's size will grow by 1 panel."
  # `SizeStep` turns it into deltas on `footprint.w`/`footprint.h`, which is
  # what the token, the board's occupancy and the platform rules all speak.
  - key: SizeStep
    value: 1
    perStack: { effect: proliferationStock, each: 3 }

  # "Each time Kingprotea grows, her Range is increased by 1 panel and her MOV
  # is decreased by 1." Per GROWTH, so they share the `each: 3`.
  - key: RangeDelta
    value: 1
    isBuff: false
    perStack: { effect: proliferationStock, each: 3 }
  - key: MovDelta
    value: -1
    isBuff: false
    perStack: { effect: proliferationStock, each: 3 }
