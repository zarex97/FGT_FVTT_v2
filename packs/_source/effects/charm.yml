# Appendix A -- a mental debuff that hands the Unit's actions to the inflicter
# for the duration.
#
# `rules/control.mjs#isCharmed` has looked for exactly this id since it was
# written and there was no document for it to find, so the whole control
# subsystem was pointing at an effect that did not exist. First inflicter:
# Pale Rider's Contagion, "10% chance of being inflicted with Charm for 1◈".
#
# No rules of its own: control is not a modifier, it is a question the turn
# machinery asks (`isCharmed`), and the answer is the effect's presence.
schema: 1
id: charm
name: "Charm"
description: |
  The Unit is controlled by the inflicter's Faction for the duration: its owner does not choose
  its Moves or Attacks.
polarity: debuff
# `mental`, which is Appendix A's own classification and the thing Heracles'
# Bravery and Jack's Mental Pollution both name -- so both already resist this
# without either sheet listing it.
volatility: mental
valence: offensive
stacking: noneRefresh
baseChance: 100
severity: normal
defaultDuration: "1◈"
rules:
  # "Removed at the end of the Combat Phase if the Unit takes damage from an
  # Attack." The PHASE, not the Process -- a Counter is part of the same
  # exchange (Ch. 12 §12.1), so a Charm broken by the opening attack should not
  # also be broken a second time by the counter it provoked.
  #
  # `requiresDamagedThisPhase` is answered against the damage the phase
  # actually did, so an Evade, a Block that absorbed all of it, or simply being
  # the attacker all leave the Charm standing.
  - key: OnEvent
    event: combatPhaseEnd
    automatic: true
    requiresDamagedThisPhase: true
    then:
      - { key: RemoveEffect, effect: charm }

  # "Immune to Confuse and Berserk while charmed." Appendix A states the same
  # exclusion from all three sides; this is Charm's. Neither of the other two
  # is authored yet (Ch. 18 §18.5 lists Confuse's random selector as open), so
  # this is inert today and correct the moment either exists -- which is the
  # right way round: the alternative is remembering to come back here.
  - key: Immunity
    effects: [berserk, confuse]
