# Appendix A §A.3.
# "Ignores `Dodge` and the Evade action. Beaten by `Substitution`."
#
# Catalogued since Appendix A was written and never defined. `rules/checks.mjs
# #evade` has taken an `attackHasAim` parameter all along, and `dodge.yml` has
# declared `beatenBy: [aim]` since it was authored -- so the whole
# Dodge/Aim/Substitution ladder had one rung missing and the two that existed
# could never meet.
#
# NO RULE ELEMENTS, and that is the finished state. `Aim` is a property of the
# ATTACK, and the attack spec reads it off its bearer by name, exactly as
# `rollEvade` reads the defender's `dodge`. A rule element would be a second
# path to the same fact.
schema: 1
id: aim
name: "Aim"
description: "Attacks ignore @effect[dodge]{Dodge} and the @effect[evade]{Evade} action. Beaten by Substitution."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: noneRefresh
baseChance: 100
# `blockedBy: [substitution]` is DELIBERATELY ABSENT, and now for a better
# reason than the one first recorded here.
#
# The original note said the id was unauthored and a dangling link would be
# refused by the build. `substitution` is authored now, and the field is still
# wrong -- `blockedBy` gates APPLICATION against what its own target already
# holds (`effect-applier.mjs`, the exclusivity gate), and these two effects are
# never on the same Unit: Aim rides the attacker, Substitution the defender.
# Writing it would declare that a Unit cannot be given Aim while some other Unit
# is untouchable, which is not the ladder Appendix A describes.
#
# The relationship is enforced where it belongs and not by this file: stage 0 of
# the damage pipeline halts on a defender holding `substitution` before anything
# about the attack -- Aim included -- is consulted. That is exactly what "cannot
# be hit by anything, even against Aim" means.
rules: []
