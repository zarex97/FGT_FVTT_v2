# Nursery Rhyme, char_orig_sheets/Copia de Nursery Rhyme.md
#
# The marker the tokens hang from. It carries the escape ladder and the death
# roll; the TOKENS themselves are an ordinary Ch. 06 resource pool, and the stat
# reductions are performed by the Noble Phantasm's own grant.
#
# `polarity: status`. It is neither a buff nor a debuff in any useful sense, and
# a Noble Phantasm whose entire counter-play is one Luck Check must not also
# fall to an ordinary Cleanse -- the sheet gives exactly one way out and spends
# six lines describing it.
schema: 1
id: namelessForest
name: "Nameless Forest"
description: |
  For every @effect[namelessForest]{Nameless Forest} Token on this Unit, its Max Health is reduced by
  25, both Base Attacks by 10, and its Max Luck by 1 — permanently. Once per Turn during its own Turn
  it may attempt a Luck Check to remove every Token; Health and Luck already lost are not restored.
  At the end of its Turn, a Unit with at least 3 Tokens rolls a twelve-sided die and disappears on a
  roll at or below the count — unless it is within its Home Base.
polarity: status
volatility: nonVolatile
stacking: noneRefresh
baseChance: 100
unremovable: true
# What each landing costs, paid on every landing, a refresh included: one
# Token, and the four permanent losses its sheet ties to a Token (#247 D3).
onApplyEachLanding: true
onApply:
  # THE TOKEN. A full path: `resourcePathFor` sends a key the Unit does not
  # hold yet to the root of `system`, and a Drake's first Token was a write to
  # `system.namelessForestTokens` the model dropped (#247, test).
  - { key: ResourceDelta, resource: resources.namelessForestTokens.value, delta: 1 }
  # ...and how many the forest has ever given: never removed by an escape and
  # never rewound, so the Glass Game can leave the forest's losses standing
  # with its Tokens (#247 reading 6).
  - { key: ResourceDelta, resource: resources.namelessForestCaught.value, delta: 1 }
  # Not a `MaxDelta` scaled by the held count: "(Health and Luck that are lost
  # from the effects of this NP are not restored)". A contribution would spring
  # back the instant the Tokens left. `alsoCurrent` clamps the current value to
  # the new ceiling and does not move a wounded one (#247 reading 5).
  - { key: StatDelta, stat: "health.max", delta: -25, alsoCurrent: true }
  # Base Attack is DERIVED on every prepare; the penalty is what
  # `domain/base-attack.mjs` subtracts, permanent and stable.
  - { key: StatDelta, stat: "baseAttackPenalty.str", delta: 10 }
  - { key: StatDelta, stat: "baseAttackPenalty.mag", delta: 10 }
  - { key: StatDelta, stat: "luck.max", delta: -1, alsoCurrent: true }
rules:
  # THE LADDER (MAG Rank, and -3 within its Home Base) is NOT here. It is the
  # escape's alone, and `rules/nameless-forest.mjs#escapeModifiers` reads it
  # for the escape. Authored as a `check: luck` CheckModifier it reached every
  # Luck Check a caught Unit made, and the escape counted it twice: Arturia's
  # read "(MAG A −2, namelessForest −2)" (#247, live).

  # THE DEATH ROLL. `turnEnd` fires for the units of the faction whose Turn is
  # ending -- "at the end of the UNIT'S Turn", not Nursery's, and not the
  # Round's. Firing it at `roundEnd` instead would roll once per Round for
  # everybody at once, which is a different ability.
  #
  # The d12 is declared on the ACTION so `pendingRolls` gathers it before the
  # sequence runs; the arithmetic is `rules/nameless-forest.mjs`.
  - key: OnEvent
    event: turnEnd
    automatic: true
    then:
      - key: NamelessForestDeathRoll
        resource: namelessForestTokens
        roll: { key: namelessForestDeath, formula: "1d12" }
