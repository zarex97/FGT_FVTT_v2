# Appendix A §A.1's `Atk Up (X)` family — the same shape as `Atk Up (Greek Male)`.
#
# The `Magus` attribute is defined by Mannanán's own Sealing Designation
# Enforcer: *"Masters, Casters, all Units whose Normal Attacks use Base Attack
# (MAG)."* That is a derived attribute rather than an authored tag, closed for
# every Unit by `domain/attributes.mjs` -- so this predicate is one option and
# not three.
schema: 1
id: atkUpMagus
name: "Atk Up (Magus)"
description: "All damage dealt to Units with the 'Magus' Attribute is increased by X%, including NP."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: magnitudeStacks
baseChance: 100
rules:
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    value: "@magnitude"
    # "including NP" -- stated, so the usual reduced NP magnitude does not apply.
    npValue: "@magnitude"
    predicate: ["target:attribute:magus"]
