# Appendix A §A.1's `Atk Up (X)` family — the same shape as `Atk Up (Greek Male)`.
#
# The `Magus` attribute is defined by Mannanán's own Sealing Designation
# Enforcer: *"Masters, Casters, all Units whose Normal Attacks use Base Attack
# (MAG)."* That is a derived attribute rather than an authored tag, closed for
# every Unit by `domain/attributes.mjs` -- so this predicate is one option and
# not three.
schema: 1
id: atkUpMagus
name: "Atk Up (Magus)"
description: "All damage dealt to Units with the 'Magus' Attribute is increased by X%, including NP."
polarity: buff
volatility: nonVolatile
valence: offensive
stacking: magnitudeStacks
baseChance: 100
rules:
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    value: "@magnitude"
    # "including NP" -- stated, so the usual reduced NP magnitude does not apply.
    # "Including NP" is stated by OMITTING `npValue`: an absent npValue makes
    # the pipeline use `value` against a Noble Phantasm too
    # (`damage/pipeline.mjs`, `isNP && m.npValue !== undefined ? ... : m.value`),
    # which is the full magnitude this clause wants. Writing `npValue:
    # "@magnitude"` here reads as the same assertion and is not one -- that
    # token is only substituted into `value`, so it resolved to nothing and the
    # field was dropped. The behaviour was right and the line was inert; the
    # content validator now refuses it.
    predicate: ["target:attribute:magus"]
