# Appendix A §A.14
# "Max AND current Agility −3. At the start of every turn, roll d6; on 3 or 4
# the unit cannot act. On removal, current Agility +1 when max is restored."
#
# Inflicted by Scáthach's Þurs.
schema: 1
id: shock
name: "Shock"
description: |
  Maximum and current Agility are reduced by 3. At the start of every Turn, roll a d6; on a
  3 or a 4 the Unit cannot act. On removal, current Agility is restored by 1 alongside the
  maximum.
polarity: debuff
volatility: volatile
valence: defensive
stacking: noneRefresh
baseChance: 100
severity: normal
# Appendix A lists this among `Bind`'s members: "Bind -- umbrella for Stun,
# Disable, Immobilize, Slow, Petrify, Shock, Webbed, Seal, Freeze,
# Crystalfreeze." Declared here rather than in a central list so a binding
# effect authored later counts by saying so about itself.
families: [bind]
rules:
  # The MAXIMUM is derived: it comes back the moment the effect goes. The
  # CURRENT is not -- it is paid once, below, when Shock lands (#106). A derived
  # `agility.value -3` was re-applied on every preparation and baked into the
  # stored value by every Agility write, so a Shocked Unit lost three more
  # Agility each time it spent one.
  - key: MaxDelta
    stat: agility
    value: -3

  # The d6. A gate on the handler's own die rather than an application chance:
  # the Stun it applies has a chance of its own, and folding the two together
  # would let Debuff ResUp shorten the odds on a roll the sheet does not
  # describe as a debuff roll.
  - key: OnEvent
    event: turnStart
    automatic: true
    then:
      - key: ApplyEffect
        roll: { key: shockJolt, formula: "1d6" }
        when: { in: [3, 4] }
        duration: "1 turns"
        effect: { defId: stun }

# "Maximum and current Agility are reduced by 3": the current half, paid once
# on creation and not again when the effect is refreshed.
onApply:
  - key: StatDelta
    stat: agility.value
    delta: -3

onRemove:
  # "current Agility +1 when max is restored" -- one point back, not the three
  # the maximum regains. The asymmetry is the source's, and it is why the
  # clause exists at all.
  - key: StatDelta
    stat: agility.value
    delta: 1
