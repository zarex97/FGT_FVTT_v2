# Appendix A -- a Range modifier. Kiritsugu's Familiars grants it: "applies Range
# Up for 1◈ Turns, Range is increased by 2."
#
# EMIYA's Magecraft used to share this id, being the first content to grant a Range
# Up. It is `Range Up (Hawkeye)` now, a named effect of its own (`rangeUpHawkeye`,
# ruled 2026-10-14, #208 reading 14): the two stack, and each refreshes only itself.
schema: 1
id: rangeUp
name: "Range Up"
description: "Range is increased by X panels."
polarity: buff
volatility: nonVolatile
valence: offensive
# "Does not stack, but duration is extended if reapplied" -- which is exactly
# what `noneExtend` means, and the reason it is one of the six stacking rules
# rather than a special case here.
stacking: noneExtend
baseChance: 100
rules:
  - key: RangeDelta
    value: "@magnitude"
