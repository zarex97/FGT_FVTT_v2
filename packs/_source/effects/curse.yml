# Appendix A §A.12
# "Stage N deals 25 x N Curse damage at the end of the turn, every 1/3 fixed.
#  Reapplication adds a stage."
schema: 1
id: curse
name: "Curse"
description: "Deals 25 x stage Curse damage at the end of the affected unit's turn."
polarity: debuff
volatility: volatile
valence: offensive
stacking: stage
baseChance: 100
# "25 x N": 25 at stage 1, `perStage` (#105). Curse Heal turns it into healing.
periodic: { when: turnEnd, amount: 25, scaling: perStage, healConversion: cursHeal, bypassModifiers: true }
