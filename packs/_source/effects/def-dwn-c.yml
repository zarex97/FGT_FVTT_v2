# Appendix A §A.9 / docs/14-effect-taxonomy.md — the third Def Dwn variant.
#
# "Def Dwn (C) | Agility −1 at end of Damage Step whenever successfully Attacked."
# A distinct effect and not a stronger Def Dwn: the extra clause is what the
# letter names, and content that strips "one Def Dwn" must not take this instead.
schema: 1
id: defDwnC
name: "Def Dwn (C)"
description: "All damage taken is increased by X%; Agility is reduced by 1 whenever this Unit is successfully Attacked."
polarity: debuff
volatility: nonVolatile
valence: defensive
stacking: magnitudeStacks
baseChance: 100
families: [defDwn]
rules:
  - key: DamageModifier
    modifierKey: defDwn
    direction: taken
    value: "@magnitude"
    # "All damage taken is increased by 10%" with no NP clause, so the NP
    # magnitude is the same number rather than the usual halving.
    # "Including NP" is stated by OMITTING `npValue`: an absent npValue makes
    # the pipeline use `value` against a Noble Phantasm too
    # (`damage/pipeline.mjs`, `isNP && m.npValue !== undefined ? ... : m.value`),
    # which is the full magnitude this clause wants. Writing `npValue:
    # "@magnitude"` here reads as the same assertion and is not one -- that
    # token is only substituted into `value`, so it resolved to nothing and the
    # field was dropped. The behaviour was right and the line was inert; the
    # content validator now refuses it.

  # The second clause. `damageTaken` fires on the Unit that RECEIVED the damage
  # -- the mirror of `damageDealt`, and the reason it had to start firing: every
  # rider in the catalogue that pays out for being hit had no rung at all.
  #
  # *"whenever damage is received from an ATTACK"*: not a field's, a toll's or a
  # cost's -- they never raise `damageTaken` at all -- and not the measured
  # damage of a Knockback, which runs a Process for the arithmetic and is not an
  # Attack (#184 reading 8). `attack:plainDamage` is what says so (#223, found by
  # the Dioscuri audit; it reaches every Servant who inflicts Def Dwn).
  #
  # ONCE PER ATTACK, on `attackReceived` (#239, ruled 2026-10-17 for every Def Dwn
  # (A) and (C), whatever the sheet's wording): a successful Attack -- a Block, a
  # hit for 0 and an Instakill that skipped the damage count; an Evade, a complete
  # negation and a concealment coin do not -- drains one, however many hits it
  # made. It listened to `damageTaken`, once per hit and never on a skip. The
  # event fires before the Attack's riders, so this Attack's own Def Dwn does not
  # hear it (#209), and never for a Knockback's measured damage, which is not an
  # Attack (#184 reading 8, #223); the predicate stays as the second guard.
  - key: OnEvent
    event: attackReceived
    automatic: true
    predicate: ["not:attack:plainDamage"]
    then:
      - { key: StatDelta, stat: "agility.value", delta: -1 }
