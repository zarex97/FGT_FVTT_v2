# Guidance of the Netherworld effect 2: "Applies Regen for 1◈ Turns, Health is
# restored by 10% of its maximum value at the end of the Unit's Turn, the end
# of any Turn the Unit Acts, and at the end of the Round."
#
# Three boundaries on one handler rather than three handlers: they are one
# clause, and the deduplication §E.2 describes (an effect fires once per
# `(effectId, globalTurn)`) is what stops a Unit that Acted on its own Turn
# healing twice for the same sentence.
#
# Of MAXIMUM, not of current -- the same reading `skill-use.mjs`'s `heal` phase
# already makes for Medea, and the reason `Heal` gained `percentOfMax`.
schema: 1
id: regen
name: "Regen"
description: |
  Health is restored by 10% of its maximum value at the end of the Unit's Turn, the end of any
  Turn the Unit Acts, and at the end of the Round.
polarity: buff
volatility: nonVolatile
valence: defensive
stacking: noneRefresh
baseChance: 100
rules:
  - key: OnEvent
    # `event`, which may be an ARRAY -- `normalizeHandler` reads `el.event`
    # and spreads it when it is one. Regen is the first multi-event handler in
    # the corpus, and authored as `events:` it produced a handler listening
    # for `undefined`: it compiled, loaded, and healed nobody, ever.
    event: [turnEnd, actedTurnEnd, roundEnd]
    automatic: true
    then:
      - { key: Heal, percentOfMax: 10 }
notes: |
  "Does not fire on the turn it ends" (Appendix A, and Ch. 11 §11.9 generally) is enforced by
  the engine, not by this file: a handler contributed by an effect carries that effect's
  expiry, and `fireEvent` skips it on the tick it runs out. The rule already held for
  `periodic:` effects and had never held for handlers, which is the shape Regen uses.
