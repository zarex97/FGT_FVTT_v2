# Pollux, char_orig_sheets/Copia de Dioscuri.md
#
# The FOURTH Riding variant, and the one whose Active unlocks all THREE
# passives:
#
#   "(Active) Used during your Turn. Increases MOV by 4 panels for this Turn.
#    ADDITIONALLY, 'Double Move', 'Riding Attack', and 'Passenger Seat' can be
#    used on this Turn."
#
# `class-riding` grants all three permanently; `riding-medusa` gates two and
# leaves Double Move permanent, and its own header says so in as many words;
# `riding-achilles` gates them on a stance. Pollux names three, so she is a
# fourth document rather than a flag on any of them.
schema: 1
id: class-riding-pollux
name: "Riding"
source: class
slug: riding
kind: classSkill
copyable: { allowed: false, reason: classSkill }
parameterized: [rank]
rank: "@rank"
cooldown: "@cooldown"
description: |
  (Active) Used during your Turn. Increases MOV by 4 panels for this Turn. Additionally,
  'Double Move', 'Riding Attack' and 'Passenger Seat' can be used on this Turn.
  (Passive 1) Double Move: can Move twice during its Turn, once before and once after Attacking;
  total distance Moved cannot exceed the Unit's MOV.
  (Passive 2) Riding Attack: can Attack all Units in its path while Moving in a straight line as
  its Normal Attack during its Turn. Cannot Attack or Move after it has stopped. If the Unit has
  already Moved this Turn, the panels it may Move for its Riding Attack equal its MOV minus the
  panels already Moved. Can be combined with Passenger Seat.
  (Passive 3) Passenger Seat: the Servant's Master can Move together with its Servant; after
  Moving, both must be in the same relative position as before. Counts as only Moving one Unit.

  The @effect[movUp]{MOV Up} from the Active is NOT a buff: it cannot be removed by buff removal and is not
  prevented by an effect that blocks buffs.
passiveRules:
  # All THREE gated on the marker the Active applies -- the distinction from
  # `riding-medusa`, where Double Move is unconditional.
  - key: GrantedAbility
    abilities: [doubleMove, ridingAttack, passengerSeat]
    predicate: ["self:effect:ridingActive"]
# NO `activeRules`: this ability has phases, so it is USED rather than toggled,
# and `contributionsOf` collects `activeRules` only for a mode. The MOV Up lives
# on the effect the Active applies, which is in force for exactly as long as the
# Active lasts. `tools/lib/content.mjs` fails the build on the other shape.
phases:
  - kind: applyEffects
    target: self
    rules:
      # 4 is `ridingMov` at grade B, which is the number her sheet prints.
      - { effect: { id: ridingActive }, duration: "this turn", magnitude: 4 }
