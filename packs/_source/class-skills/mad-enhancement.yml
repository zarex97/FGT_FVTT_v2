# docs/B-rank-tables.md §B.3 — verified against six sheets across two rosters.
#
# A MODE, not a passive: it is activated and deactivated, and while active it is
# "neither a buff nor a debuff, and Unremovable" — so buff removal cannot strip
# it and No Buff cannot prevent it.
schema: 1
id: class-mad-enhancement
name: "Mad Enhancement"
source: class
# The slug is stated rather than derived. The default strips `class-` and leaves
# the KEBAB-CASE id (`mad-enhancement`), while every predicate, requirement and
# compulsion in the game names it in camelCase -- so
# `self:skillActive:madEnhancement` matched nothing, `modeActive: madEnhancement`
# refused for ever, and Penthesilea's whole kit hinges on both.
slug: madEnhancement
kind: classSkill
copyable: { allowed: false, reason: classSkill }
# `drainFloor` and `forcedDeactivation` are clause 1, which the six sheets
# carrying this skill print THREE different ways. See the block above
# `StatDelta` below. They are required parameters rather than defaulted ones on
# purpose: a default would silently give a new bearer whichever shape happened
# to be commonest, and the whole finding was that nobody noticed.
parameterized: [rank, drainFloor, drainFloorWhen, forcedDeactivation]
rank: "@rank"
isMode: true
# "When Mad Enhancement is Activated, it can only be deactivated 2◈ Turns after
# it was activated AND VICE VERSA" -- one clock, both directions. The toggle was
# a bare write until `rules/modes.mjs` existed, so this clause had nowhere to
# live and the mode could be flipped every Turn for free.
toggleLock: "2◈"
description: |
  (Active) While Active-
  1. This Servant's Master loses Health at the end of every Turn it Acts; when the Master's
     Health is at or below that amount, Mad Enhancement is forcibly deactivated, and until it
     may be deactivated the Master's Health cannot drop below it in this way.
  2. All damage taken is reduced; a smaller reduction applies to NP.
  3. All damage dealt is increased including NP; halved for Base Attack (MAG).
  4. MOV +2, Range +1, the Master's ZON +2.
  5. Sustainability is reduced by 2◈ if its Master is defeated while Active.
  6. This Servant can only Evade with Evade−.
  7. The effects are neither a buff nor a debuff, and are Unremovable.
activeRules:
  # The STR share goes into the stage-4 bucket; the MAG differential is applied
  # at stage 5, because one bucket cannot hold two magnitudes for one modifier.
  # Clause 3, as a PREDICATED PAIR rather than as a stage-4/stage-5 split.
  #
  # *"All damage dealt is increased by X% including NP; this effect is halved for
  # Attacks which use Base Attack (MAG)."* Ch. 13's stage 5 proposed contributing
  # `min(str, mag)` to the additive bucket and the difference to stage 5, on the
  # grounds that "one bucket cannot hold two magnitudes for one modifier". It
  # can now: a DEFERRED predicate (`attack:` clauses, built for Scáthach and
  # EMIYA long after that decision was written) picks which magnitude is in the
  # bucket, and exactly one of these two ever applies.
  #
  # That is not a tidier spelling of the same arithmetic -- the split gets the
  # STR case WRONG whenever anything else is in the bucket, because stage 4 and
  # stage 5 compose multiplicatively while §13.4's rule is additive. Rank B
  # (60/30) against 100% Def Up, attacking with STR: the rulebook's own worked
  # form is (100 + 60 - 100)% = x0.60; the split gives (100 + 30 - 100)% = x0.30
  # at stage 4 and then x1.3 at stage 5 = x0.39. Ch. 13 §13.5 records the
  # correction.
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    table: madEnhancementOffence
    predicate: [not:attack:component:mag]
  - key: DamageModifier
    modifierKey: atkUp
    direction: dealt
    table: madEnhancementOffence
    # "Halved" -- the same ladder scaled, not a second one. See `magnitudeFactor`
    # in `rules/elements.mjs`: a `madEnhancementOffenceMag` table would be six
    # numbers obliged to stay exactly half of six others.
    magnitudeFactor: 0.5
    # ...rounded DOWN to a multiple of 5, which is the author's own arithmetic.
    # Every even rank is unaffected (60→30, 100→50); Kingprotea's A+ is the
    # first odd one and her sheet writes the answer out: *"halved for Attacks
    # which use Base Attack (MAG) **(40%)**"*, where 85/2 is 42.5.
    magnitudeRoundTo: 5
    predicate: [attack:component:mag]
  # Clause 2. `madEnhancementDefence` is an `[normal, vsNP]` PAIR -- B is
  # `[40, 20]` -- and the second half is picked up by `DamageModifier` as the
  # modifier's `npValue`. It used to be dropped on the floor by `scalar()`, so
  # every Mad Enhancement in the game reduced Noble Phantasm damage by its full
  # normal figure.
  - key: DamageModifier
    modifierKey: defUp
    direction: taken
    table: madEnhancementDefence
  - key: MovDelta
    value: 2
    isBuff: false
  - key: RangeDelta
    value: 1
    isBuff: false
  # Clause 4's third part. `ZonBonus` is read by `rules/zon.mjs`, which takes
  # the HIGHEST of the non-stacking bonuses -- which is why this one does not
  # declare `stacks`: Mad Enhancement's +2 and a high-rank Master's +1 are not
  # additive (§6.9).
  - key: ZonBonus
    value: 2
  # Clause 6: the unfavourable Evade table, always.
  - key: TableOverride
    check: evade
    forceTable: unfavourable

  # Clause 1, as two actions, because it is two rules that share a trigger --
  # and because the two are NOT carried by the same sheets. Three shapes:
  #
  #   Heracles                     the floor, and NO forced deactivation
  #                                ("its Master's Health cannot drop below 20
  #                                in this way")
  #   Asterios, Castor,            the forced deactivation, and NO floor
  #   Kingprotea                   ("when its Master's Health is 20 or less,
  #                                ME is forcibly deactivated")
  #   Penthesilea, Raikou          both, with the floor conditional on the mode
  #                                being held on ("while the Skill does not
  #                                meet the condition to be deactivated")
  #
  # Authoring all of it for everybody -- which is what this template did until
  # 2026-09-16 -- gave three Servants a floor their sheets do not grant, and
  # gave Heracles a forced deactivation his sheet replaces with the floor. His
  # own `cannotDeactivate` refuses it now (Ch. 15 §15.6), but refusing a clause
  # is not the same as not having it, and the pack should say which he has.
  #
  # Penthesilea's and Raikou's CONDITIONAL floor is still authored as an
  # unconditional one: the predicate it needs ("while the Skill does not meet
  # the condition to be deactivated") has no vocabulary yet, and belongs with
  # their audits, where their whole kit is in view. Ch. 46 §46.4-C.
  # `madEnhancementDrain` has been in `domain/tables.mjs` since the tables were
  # transcribed with nothing reading it: 30 at EX, 5 at E.
  #
  # `subject: master` is the point. The effect is on the Servant and the cost
  # lands on somebody else, and every scheduler action acted on its own bearer
  # -- so a Master who could not be named could not be charged.
  #
  # `floor` limits THIS deduction rather than the pool: "its Master's Health
  # cannot drop below 30 IN THIS WAY", so ordinary damage may still take them
  # under it.
  - key: OnEvent
    event: actedTurnEnd
    automatic: true
    then:
      - key: StatDelta
        subject: master
        stat: health.value
        table: madEnhancementDrain
        direction: down
        # *"If Castor is directly next to Pollux while Mad Enhancement is
        # Active, his Master's Health lost from the effects of active Mad
        # Enhancement are halved."*
        #
        # On the SHARED template rather than in a Castor-only variant, and it
        # costs the other six bearers nothing: `self:withinOfPartner:N` is
        # emitted only for a Servant in a linked group, so for Heracles,
        # Asterios, Penthesilea, Kingprotea and Raikou the predicate is false
        # and the factor is 1.
        #
        # Scaling the LOOKUP rather than this one reading of it is the point.
        # `madEnhancementDrain` is deliberately one number said three times --
        # the drain, the floor below, and `SetMode`'s threshold -- and the
        # comment under `floorTable` records what splitting them apart cost the
        # last time. Halving only the drain would split them again: beside
        # Pollux, Castor's Master would lose 10 while Mad Enhancement kept
        # running until they were under 20.
        tableFactor: { value: 0.5, predicate: ["self:withinOfPartner:1"] }
        # The SAME table as the drain, not a literal, for the bearers who have
        # a floor at all. Clause 1 is one number said three times -- Heracles's
        # is *"loses 20 Health ... cannot drop below 20 in this way"* -- and
        # both of these were authored as `30`, which is `madEnhancementDrain`'s
        # **EX** value. At every rank below EX the floor clamped against a
        # number the Servant's own sheet never mentions.
        #
        # `null` for a bearer whose sheet prints no floor; `elements.mjs` reads
        # `if (a.floorTable)` and leaves the deduction unclamped.
        floorTable: "@drainFloor"
        # ...and for the two whose floor is CONDITIONAL, when it applies.
        # Penthesilea and Raikou both print *"while the Skill does not meet the
        # condition to be deactivated, its Master's Health cannot drop below N
        # in this way"* -- so the floor holds exactly while the mode is held ON,
        # which for her is a Greek Male within 4 panels and for Raikou is her
        # Master within 2. `null` for the unconditional floor (Heracles) and for
        # the three bearers who have none at all.
        floorPredicate: "@drainFloorWhen"

      # "When its Master's Health is [the drain] or less, ME is forcibly
      # deactivated." Ordered after the drain, so it tests what the drain left.
      # Note the asymmetry the source draws: this is forcible, and a player's own
      # click is still refused by the 2◈ lockout above -- and by
      # `cannotDeactivate`, which it does NOT beat (Ch. 15 §15.6).
      #
      # Dropped at build time for a bearer whose sheet does not print it, so the
      # compiled document says what that Servant has.
      - key: SetMode
        onlyIf: "@forcedDeactivation"
        ability: madEnhancement
        active: false
        whenValue: { subject: master, stat: health.value, lteTable: madEnhancementDrain }
        # The same halving as the drain above, for the same reason: one number,
        # three readings, and they must not disagree.
        tableFactor: { value: 0.5, predicate: ["self:withinOfPartner:1"] }

  # Clause 5 is deliberately NOT here. "Sustainability is reduced by 2◈ if its
  # Master is defeated while ME is Active" is a consequence of the Master
  # dying, not of the mode ticking, and it already lives where §16.6 puts it --
  # `onMasterDefeated`, alongside the contract change and the mode lock that
  # happen in the same moment. Authoring it again here would charge it twice.
