# docs/B-rank-tables.md §B.3 — the Avenger class set (Ch. 15 §15.6).
#
# TWO EVENTS, ONE PAYOUT. *"At the end of Castor's Turn AND at the end of any
# Turn he Acts"* -- and on a Turn that is both, it fires ONCE. Appendix E §E.2
# guarantees it: when `unitTurnEnd` and `actedTurnEnd` would both fire for the
# same unit on the same turn, each EFFECT fires once, keyed by
# `(effectId, globalTurn)`. So the two-event handler needs no gate of its own.
schema: 1
id: class-self-replenishment-mana
name: "Self-Replenishment (Mana)"
source: class
slug: selfReplenishmentMana
kind: classSkill
passive: true
copyable: { allowed: false, reason: classSkill }
parameterized: [rank]
rank: "@rank"
description: |
  (Passive) At the end of this Servant's Turn, and at the end of any Turn in which it Acts, its
  Health is restored and its NP Cooldown is reduced by a number of literal Turns.
passiveRules:
  - key: OnEvent
    event: [unitTurnEnd, actedTurnEnd]
    automatic: true
    then:
      - { key: StatDelta, stat: "health.value", table: selfReplenishmentHealth, clamp: true }
      # `table` on a CooldownDelta feeds `delta` -- a LITERAL turn count -- not
      # `ticks`. *"reduced by 2 Turns"* is not "2◈", and `engine/scheduler.mjs`
      # distinguishes the two by field. Ch. 34 §34.8 proposes a `unit: turns`
      # marker for this; the distinction already existed.
      - { key: CooldownDelta, scope: np, table: selfReplenishmentCooldown, direction: down }
