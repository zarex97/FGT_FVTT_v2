# docs/B-rank-tables.md §B.3
schema: 1
id: class-riding
name: "Riding"
source: class
parameterized: [rank]
rank: "@rank"
cooldown: "@cooldown"
description: |
  (Passive 1) Double Move.
  (Passive 2) Riding Attack.
  (Passive 3) Passenger Seat.
  (Active) Increases MOV for this Turn.

  The @effect[movUp]{MOV Up} from the Active is NOT a buff: it cannot be removed by buff removal and is not
  prevented by an effect that blocks buffs.
passiveRules:
  - key: GrantedAbility
    abilities: [doubleMove, ridingAttack, passengerSeat]
activeRules:
  - key: MovDelta
    table: ridingMov
    duration: "this turn"
    isBuff: false
