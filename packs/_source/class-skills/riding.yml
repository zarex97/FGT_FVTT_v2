# docs/B-rank-tables.md §B.3
schema: 1
id: class-riding
name: "Riding"
source: class
parameterized: [rank]
rank: "@rank"
cooldown: "@cooldown"
# The clause text, as every variant file spells it out: the card is what a player
# reads, and it used to print the names of the grants and none of the rules they
# switch on (#122). The Active says "the Riding table's value" and not a number,
# because an inline "@" is not substituted -- the number is the rank's, and the
# cooldown is the one passed beside the ref. The note that the MOV Up is not a
# buff carries no `@effect[movUp]` link: that chip opens a buff-polarity effect,
# inside the sentence that says it is not a buff.
description: |
  (Passive 1) Double Move: can Move twice during its Turn, once before and once after Attacking;
  total distance Moved cannot exceed the Unit's MOV.
  (Passive 2) Riding Attack: can Attack all Units in its path while Moving in a straight line as
  its Normal Attack during its Turn. Cannot Attack or Move after it has stopped. Can be combined
  with Passenger Seat. If the Unit has already Moved this Turn, the panels it may Move for its
  Riding Attack equal its MOV minus the panels already Moved.
  (Passive 3) Passenger Seat: the Servant's Master can Move together with its Servant; after
  Moving, both must be in the same relative position as before. Counts as only Moving one Unit.
  (Active) Used during your Turn. Increases MOV for this Turn by the Riding table's value for this
  rank. Cooldown: the Riding table's value for this rank.

  The MOV bonus from the Active is NOT a buff: it cannot be removed by buff removal and is not
  prevented by an effect that blocks buffs.
passiveRules:
  - key: GrantedAbility
    abilities: [doubleMove, ridingAttack, passengerSeat]
activeRules:
  - key: MovDelta
    table: ridingMov
    duration: "this turn"
    isBuff: false
    # The +MOV moves the mount she drives, not only her own feet: Quetzalcoatl
    # riding the Quetzalcoatlus moves 7 + 6 = 13 (ruled 2026-10-02, #65,
    # ruling 27). `rules/movement.mjs#moverFor` adds it to the mount's MOV.
    carriesToMount: true
