# docs/B-rank-tables.md §B.3.
# Heracles's and Achilles's sheets both print "the number of dice rolled is doubled"
# rather than the common skill's "the Total value of the roll is doubled". The
# per-Servant sheet wins (Ch. 41 Q16); npDiceDoubled carries that.
schema: 1
id: class-battle-continuation
name: "Battle Continuation"
source: class
# The slug is stated rather than derived. The default strips `class-` and leaves
# the KEBAB-CASE id (`mad-enhancement`), while every predicate, requirement and
# compulsion in the game names it in camelCase -- so `self:skillActive:madEnhancement`
# matched nothing, `modeActive: madEnhancement` refused for ever, and Medea's Atlas
# lost its `skillRank:magicResistance` reduction without saying so.
slug: battleContinuation
parameterized: [rank]
rank: "@rank"
description: |
  (Passive 1) All damage received is reduced by the table roll; if NP, the number of dice
  rolled is doubled.
  (Passive 2) When this Unit is defeated, it is automatically revived. Requires the Unit's
  Health to have exceeded half its maximum at least once since the last activation.
passiveRules:
  - key: DamageNegation
    mode: dice
    table: battleContinuationReduction
    npDiceDoubled: true
  # A `RevivalSource`, not an `OnEvent` with a `revive:` shorthand. Heracles has
  # FOUR ways back and his sheet states the order they resolve in -- "Undying >
  # normal Guts > Battle Continuation > God Hand" -- so revival is a
  # priority-ordered query rather than whichever handler happens to heal first.
  # Priority 100 is §31.2's "passive revival skill" tier.
  #
  # `requiresHealthRestoredSince` is the second condition, which had never been
  # enforced: "the Unit's Health must have been RESTORED BACK to above half its
  # maximum value at least once since the last activation" is a question about
  # history, and a snapshot of the present cannot answer it. `healthWatermarks`
  # records the crossing when it happens.
  - key: RevivalSource
    id: battleContinuation
    revivalPriority: 100
    # NO charge limit. It is gated by its own Cooldown and by the recovery
    # clause, not by a budget -- "can only be used N times" is God Hand's rule
    # and not this one, and a `charges: 1` here would exhaust it permanently
    # after the first revive.
    requiresHealthRestoredSince: 0.5
    restore:
      table: battleContinuationRevive
      cooldownTable: battleContinuationCooldown
