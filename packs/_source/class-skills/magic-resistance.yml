# docs/B-rank-tables.md §B.3
# Authored once, instantiated eleven times across the reference set at seven ranks.
schema: 1
id: class-magic-resistance
name: "Magic Resistance"
source: class
# The slug is stated rather than derived. The default strips `class-` and leaves
# the KEBAB-CASE id (`mad-enhancement`), while every predicate, requirement and
# compulsion in the game names it in camelCase -- so `self:skillActive:madEnhancement`
# matched nothing, `modeActive: madEnhancement` refused for ever, and Medea's Atlas
# lost its `skillRank:magicResistance` reduction without saying so.
slug: magicResistance
kind: classSkill
passive: true
copyable: { allowed: false, reason: classSkill }
parameterized: [rank]
rank: "@rank"
description: |
  (Passive 1) MAG damage from a MAG Rank of up to @rank is negated, otherwise MAG damage
  taken is reduced by the table value. Also affects NP.
  (Passive 2) Chance of being inflicted by debuffs is reduced.

  Also affects Instakill and Death UNLESS the source deals STR damage or is otherwise
  unaffected by Magic Resistance. Erase is completely unaffected.
passiveRules:
  # The negated rank is the skill's own rank, extended by each +, which is why
  # Magic Resistance A+ negates up to A+ and not up to A.
  - key: Resistance
    component: mag
    mode: rankComparison
    negatesUpToRank: "@rank"
    table: magicResistancePercent
    includesNP: true

  # Passive 2, as an `ApplicationChance` rather than a `CheckModifier`.
  #
  # It was a `CheckModifier` from the day it was written, which lands in
  # `unit.checkModifiers` -- and the effect applier reads resistance off
  # `unit.applicationChances`. So the single most common defensive Skill in the
  # game reduced nobody's debuff chance by anything. Same defect shape as the
  # ZON tables and `fireEvent`: right, collected, and never asked.
  #
  # ORDINARY debuffs. The severity ladder is a separate clause below, because
  # the two carry different exemptions.
  - key: ApplicationChance
    direction: incoming
    severity: normal
    table: magicResistanceDebuffResist

  # "Also affects Instakill and Death UNLESS the Instakill or Death debuffs are
  # from an Attack/Attack Skill/Spell/NP that deals STR damage or that is not
  # affected by Magic Resistance."
  #
  # Both tiers at one magnitude, and the exemption is a property of the INCOMING
  # ATTACK rather than of the bearer -- which is why it is an `attackPredicate`,
  # tested when the effect is applied, and not the collection-time `predicate`.
  #
  # Erase is absent deliberately: "Erase is completely unaffected."
  - key: ApplicationChance
    direction: incoming
    severity: [instakill, death]
    table: magicResistanceDebuffResist
    attackPredicate:
      - { not: "attack:component:str" }
      - { not: "attack:ignoresMagicResistance" }
