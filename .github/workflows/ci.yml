name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # The gate that matters most in practice. Content bugs are the dominant
      # failure mode in a data-driven system, and this catches them before
      # anyone loads a world.
      - name: Validate content
        run: npm run validate:content

      # Template defects are invisible to ESLint and surface as a stack trace
      # inside Foundry at render time -- the slowest feedback loop we have.
      - name: Check templates
        run: npm run check:templates

      - name: Unit and golden tests
        run: npm test

      - name: Build packs
        run: npm run build:packs

      - name: Build styles
        run: npm run build:styles

      - name: Check the manifest is well-formed
        run: node tools/check-manifest.mjs
